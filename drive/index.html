,"explanation_zh":"正确答案：浓雾中更容易被后车看到。后雾灯用于浓雾等低能见度环境，让后车更容易看到你。","category":"应急处置/急救","risk":"生词/术语；安全原则/风险判断","vocab":"rear fog lights=后雾灯"},{"id":173,"file":"Screenshot 2026-08-14 at 23.14.41.png","question_en":"What would you expect to find at a contraflow system on a motorway?","options_en":["Temporary traffic lights","Lower speed limits","Wider lanes than normal","Road humps"],"correct":"B","question_zh":"高速公路的逆向车流系统（contraflow）中通常会出现什么？","options_zh":["临时交通灯","更低的限速","比平时更宽的车道","减速丘"],"correct_zh":"更低的限速","explanation_zh":"正确答案：更低的限速。英国高速的底层逻辑是“默认靠左，右侧主要用于超车”。红X、硬路肩、紧急停车区和并入高速都有专门规则。","category":"高速公路/车道纪律","risk":"视觉识别；生词/术语","vocab":"contraflow=逆向车流；road hump=减速丘；mot=车辆年检（MOT）"},{"id":174,"file":"Screenshot 2026-08-14 at 23.14.43.png","question_en":"When are you allowed to park in a parking bay for disabled drivers?","options_en":["When you have a Blue Badge","When you have a wheelchair","When you have an advanced driver certificate","When you have an adapted vehicle"],"correct":"A","question_zh":"什么时候可以把车停在残障人士专用停车位？","options_zh":["持有Blue Badge（蓝色残障停车证）时","车内有轮椅时","持有高级驾驶证书时","车辆经过残障改装时"],"correct_zh":"持有Blue Badge（蓝色残障停车证）时","explanation_zh":"正确答案：持有Blue Badge（蓝色残障停车证）时。残障车位看 Blue Badge 资格，不是“车里有轮椅”或“车辆改装过”。","category":"英国法规/证件/行政","risk":"中国驾驶习惯迁移风险；生词/术语；英国特有规则","vocab":"blue badge=残障停车证"},{"id":175,"file":"Screenshot 2026-08-14 at 23.14.44.png","question_en":"What does this sign mean? End","options_en":["End of motorway","End of restriction","Lane ends ahead","Free recovery ends"],"correct":"B","question_zh":"这个“End”标志表示什么？","options_zh":["高速公路结束","限制结束","前方车道结束","免费道路救援结束"],"correct_zh":"限制结束","explanation_zh":"正确答案：限制结束。英国高速的底层逻辑是“默认靠左，右侧主要用于超车”。红X、硬路肩、紧急停车区和并入高速都有专门规则。","category":"高速公路/车道纪律","risk":"视觉识别；生词/术语","vocab":"mot=车辆年检（MOT）"},{"id":176,"file":"Screenshot 2026-08-14 at 23.14.46.png","question_en":"What should you do if you park on the road when it's foggy?","options_en":["Leave parking lights switched on","Leave dipped headlights and fog lights switched on","Leave dipped headlights switched on","Leave main-beam headlights switched on"],"correct":"A","question_zh":"有雾时把车停在道路上，应该怎么做？","options_zh":["保持停车灯开启","保持近光灯和雾灯开启","保持近光灯开启","保持远光灯开启"],"correct_zh":"保持停车灯开启","explanation_zh":"正确答案：保持停车灯开启。雾天把车停在路上要开停车灯，核心是让停着的车能被别人看见。","category":"天气/灯光/能见度","risk":"中国驾驶习惯迁移风险；生词/术语","vocab":"dipped headlights=近光灯；parking lights=停车灯"},{"id":177,"file":"Screenshot 2026-08-14 at 23.14.48.png","question_en":"You've broken down on a two-way road. You have a warning triangle. At least how far from your vehicle should you place the warning triangle?","options_en":["5 metres (16 feet)","25 metres (82 feet)","45 metres (147 feet)","100 metres (328 feet)"],"correct":"C","question_zh":"车辆在双向道路上故障，并有三角警示牌。至少应放在车后多远？","options_zh":["5米（16英尺）","25米（82英尺）","45米（147英尺）","100米（328英尺）"],"correct_zh":"45米（147英尺）","explanation_zh":"正确答案：45米（147英尺）。普通双向道路故障三角牌至少放到 45 m（147 ft）外。","category":"应急处置/急救","risk":"数字/单位记忆；安全原则/风险判断","vocab":""},{"id":178,"file":"Screenshot 2026-08-14 at 23.14.49.png","question_en":"What does this sign mean?","options_en":["Motorcycles only","No cars","Cars only","No motorcycles"],"correct":"D","question_zh":"这个标志表示什么？","options_zh":["只允许摩托车","禁止小汽车","只允许小汽车","禁止摩托车"],"correct_zh":"禁止摩托车","explanation_zh":"正确答案：禁止摩托车。这是视觉记忆题，别靠语感。把“形状+颜色+线型+灯序”成组背，尤其是红圈、三角警告、黄线、红X和反光道钉。","category":"交通标志/标线/信号","risk":"视觉识别；生词/术语","vocab":"mot=车辆年检（MOT）"},{"id":179,"file":"Screenshot 2026-08-14 at 23.14.51.png","question_en":"Your vehicle has stalled in the middle of a level crossing. What should you do if the warning bells start to ring while you're trying to restart the engine?","options_en":["Get out of the car and clear of the crossing","Run down the track to warn the signal operator","Carry on trying to restart the engine","Push the vehicle clear of the crossing"],"correct":"A","question_zh":"车辆熄火停在铁路平交道口中央，尝试重新启动时警铃开始响，你应该怎么做？","options_zh":["立即下车并远离道口","沿铁轨跑去通知信号员","继续尝试启动发动机","把车推离道口"],"correct_zh":"立即下车并远离道口","explanation_zh":"正确答案：立即下车并远离道口。平交道口内熄火且警铃响，第一优先是人员立即撤离道口，不要继续折腾车辆。","category":"应急处置/急救","risk":"生词/术语；安全原则/风险判断","vocab":"level crossing=铁路平交道口"},{"id":180,"file":"Screenshot 2026-08-14 at 23.14.53.png","question_en":"Which is the sign for a ring road?","options_en":["R","[Image option 2]","[Image option 3]","[Image option 4]"],"correct":"B","question_zh":"哪个是环城路（ring road）的标志？","options_zh":["图形选项1","图形选项2","图形选项3","图形选项4"],"correct_zh":"图形选项2","explanation_zh":"正确答案：图形选项2。这是视觉记忆题，别靠语感。把“形状+颜色+线型+灯序”成组背，尤其是红圈、三角警告、黄线、红X和反光道钉。","category":"交通标志/标线/信号","risk":"数字/单位记忆；视觉识别","vocab":""},{"id":181,"file":"Screenshot 2026-08-14 at 23.14.54.png","question_en":"You're about to overtake a cyclist. Why should you leave them as much room as you would give to a car?","options_en":["The cyclist might speed up","The cyclist might get off their bicycle","The cyclist might be unsettled if you pass too near them","The cyclist might have to make a left turn"],"correct":"C","question_zh":"准备超越自行车时，为什么要给骑行者留出和超越汽车差不多的空间？","options_zh":["骑行者可能突然加速","骑行者可能下车","如果你贴得太近，骑行者可能受到惊吓并失去稳定","骑行者可能需要左转"],"correct_zh":"如果你贴得太近，骑行者可能受到惊吓并失去稳定","explanation_zh":"正确答案：如果你贴得太近，骑行者可能受到惊吓并失去稳定。超自行车要留足横向空间，因为贴太近会让骑行者受惊、摇摆甚至失控。","category":"弱势道路使用者/风险感知","risk":"中国驾驶习惯迁移风险；安全原则/风险判断","vocab":""},{"id":182,"file":"Screenshot 2026-08-14 at 23.14.56.png","question_en":"What must you do when you hitch an unbraked trailer to a towing vehicle?","options_en":["Fit a secondary coupling device","Grease the tow ball and hitch","Switch off the reversing sensor on the towing vehicle","Make sure you can see the trailer in the mirrors"],"correct":"A","question_zh":"把无制动拖车（unbraked trailer）连接到牵引车时，必须做什么？","options_zh":["安装第二连接装置（secondary coupling device）","给拖车球和连接器涂润滑脂","关闭牵引车倒车雷达","确保后视镜能看到拖车"],"correct_zh":"安装第二连接装置（secondary coupling device）","explanation_zh":"正确答案：安装第二连接装置（secondary coupling device）。拖挂题不要凭普通小汽车经验猜。把专门限速、最右车道限制、MAM/noseweight 和安全连接装置当成独立知识点背。","category":"拖车/牵引规则","risk":"生词/术语；英国特有规则","vocab":"unbraked trailer=无制动拖车；coupling device=连接装置；towing=牵引"},{"id":183,"file":"Screenshot 2026-08-14 at 23.14.57.png","question_en":"What does this sign mean?","options_en":["Two-way traffic crosses a one-way road","Traffic approaching you has priority","Two-way traffic straight ahead","Motorway contraflow system ahead"],"correct":"C","question_zh":"这个标志表示什么？","options_zh":["双向道路横穿单行道","迎面车辆有优先权","前方双向交通","前方高速公路逆向车流系统"],"correct_zh":"前方双向交通","explanation_zh":"正确答案：前方双向交通。英国高速的底层逻辑是“默认靠左，右侧主要用于超车”。红X、硬路肩、紧急停车区和并入高速都有专门规则。","category":"高速公路/车道纪律","risk":"视觉识别；生词/术语","vocab":"contraflow=逆向车流；mot=车辆年检（MOT）"},{"id":184,"file":"Screenshot 2026-08-14 at 23.14.59.png","question_en":"What does this signal mean?","options_en":["Cars must stop","Trams must stop","Both trams and cars must stop","Both trams and cars can continue"],"correct":"B","question_zh":"这个信号表示什么？","options_zh":["汽车必须停车","有轨电车必须停车","有轨电车和汽车都必须停车","有轨电车和汽车都可以继续行驶"],"correct_zh":"有轨电车必须停车","explanation_zh":"正确答案：有轨电车必须停车。这是视觉记忆题，别靠语感。把“形状+颜色+线型+灯序”成组背，尤其是红圈、三角警告、黄线、红X和反光道钉。","category":"交通标志/标线/信号","risk":"视觉识别","vocab":""},{"id":185,"file":"Screenshot 2026-08-14 at 23.15.01.png","question_en":"When may you stop and wait in a box junction?","options_en":["When oncoming traffic prevents you from turning right","When you're in a queue of traffic turning left","When you're in a queue of traffic going ahead","When you're on a roundabout"],"correct":"A","question_zh":"什么时候可以在黄色网格路口（box junction）内停车等待？","options_zh":["右转时被对向来车阻挡","排队左转时","排队直行时","在环岛上时"],"correct_zh":"右转时被对向来车阻挡","explanation_zh":"正确答案：右转时被对向来车阻挡。box junction 内停车等待的典型例外：右转时被对向来车阻挡。","category":"路口/环岛/超车","risk":"中国驾驶习惯迁移风险；生词/术语","vocab":"box junction=黄色网格路口"},{"id":186,"file":"Screenshot 2026-08-14 at 23.15.03.png","question_en":"You're performing cardiopulmonary resuscitation (CPR) on a casualty. How fast should chest compressions be?","options_en":["Once per second","Twice per second","3 times per second","Once every 5 seconds"],"correct":"B","question_zh":"正在给伤员做CPR时，胸外按压速度应该多快？","options_zh":["每秒1次","每秒2次","每秒3次","每5秒1次"],"correct_zh":"每秒2次","explanation_zh":"正确答案：每秒2次。CPR 胸外按压约每秒 2 次，与每分钟约 120 次是同一个记忆点。","category":"应急处置/急救","risk":"数字/单位记忆；安全原则/风险判断","vocab":""}];
const LETTERS=['A','B','C','D'];
const STORAGE_KEY='uk_driving_wrong_questions_progress_v2';
const SETTINGS_KEY='uk_driving_wrong_questions_settings_v2';
const CATEGORY_EN={
  '交通标志/标线/信号':'Traffic signs, road markings & signals',
  '弱势道路使用者/风险感知':'Vulnerable road users & hazard perception',
  '车辆控制/机械常识':'Vehicle control & mechanical knowledge',
  '高速公路/车道纪律':'Motorways & lane discipline',
  '拖车/牵引规则':'Towing & trailer rules',
  '一般安全驾驶':'General safe driving',
  '天气/灯光/能见度':'Weather, lights & visibility',
  '行人过街设施':'Pedestrian crossings',
  '路口/环岛/超车':'Junctions, roundabouts & overtaking',
  '英国法规/证件/行政':'UK law, documents & administration',
  '应急处置/急救':'Emergencies & first aid'
};
let progress=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');
let settings=JSON.parse(localStorage.getItem(SETTINGS_KEY)||'{}');
let currentFilter='all',currentCategory='all',currentList=[],listIndex=0,isExamMode=false,examAnswers={};

function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
function qById(id){return QUESTIONS.find(q=>q.id===Number(id))}
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(progress))}
function saveSettings(){localStorage.setItem(SETTINGS_KEY,JSON.stringify(settings))}
function showZh(){return document.getElementById('toggle-zh').checked}
function showImg(){return document.getElementById('toggle-img').checked}
function categoryLabel(cat,zh){return zh?cat:(CATEGORY_EN[cat]||cat)}

function init(){
  document.getElementById('toggle-zh').checked=!!settings.zh;
  document.getElementById('toggle-img').checked=settings.img!==false;
  const cats=[...new Set(QUESTIONS.map(q=>q.category).filter(Boolean))].sort();
  const sel=document.getElementById('category'); cats.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=categoryLabel(c,false);sel.appendChild(o)});
  updateStats(); applyFilter('all');
}
function setChinese(v){settings.zh=v;saveSettings();renderCurrent()}
function setCategory(v){currentCategory=v;applyFilter(currentFilter)}
function toggleDataPanel(){document.getElementById('data-panel').classList.toggle('hidden')}

function applyFilter(type){
  currentFilter=type; currentList=[];
  QUESTIONS.forEach((q,i)=>{const s=progress[q.id]?.status; const catOK=currentCategory==='all'||q.category===currentCategory; if(!catOK)return;
    if(type==='all'||(type==='todo'&&!s)||(type==='wrong'&&s==='wrong')||(type==='correct'&&s==='correct')) currentList.push(i);
  });
  listIndex=0;
  if(type==='all'){const n=currentList.findIndex(i=>!progress[QUESTIONS[i].id]?.status);if(n>=0)listIndex=n}
  renderSelector();renderCurrent();
}
function renderSelector(){const s=document.getElementById('jump'); if(!currentList.length){s.innerHTML='<option>No questions</option>';return}
  s.innerHTML=currentList.map((ri,ai)=>{const q=QUESTIONS[ri],st=progress[q.id]?.status,icon=st==='correct'?'✅':st==='wrong'?'❌':'⬜';return `<option value="${ai}">${icon} Q${q.id} — ${esc(q.question_en.slice(0,65))}</option>`}).join(''); s.value=listIndex;
}
function renderCurrent(){
  if(!currentList.length){renderEmpty();return} const q=QUESTIONS[currentList[listIndex]],p=progress[q.id]||{},zh=showZh(),img=showImg(); const selected=isExamMode?examAnswers[q.id]:p.selected; const locked=!isExamMode&&!!p.status;
  let imageHTML=''; if(img&&q.file){imageHTML=`<div id="imgbox-${q.id}" class="imagebox"><img src="${esc(q.file)}" alt="Source screenshot for question ${q.id}" onerror="document.getElementById('imgbox-${q.id}').classList.add('hidden')"><div class="image-caption">Original screenshot: ${esc(q.file)}</div></div>`}
  let options=''; LETTERS.forEach((L,i)=>{let cls='option',disabled=''; if(isExamMode){if(selected===L)cls+=' selected'} else if(locked){disabled='disabled'; if(L===q.correct)cls+=' correct'; else if(L===selected)cls+=' wrong'; else cls+=' dim'}
    options+=`<button class="${cls}" ${disabled} onclick="answer(${q.id},'${L}')"><span class="letter">${L}.</span><span><div class="opt-en">${esc(q.options_en[i])}</div>${zh?`<div class="opt-zh">${esc((q.options_zh||[])[i]||'')}</div>`:''}</span></button>`;
  });
  let feedback=''; if(!isExamMode&&locked){const ok=p.status==='correct';feedback=`<div class="feedback ${ok?'good':'bad'}"><b>${ok?'✅ Correct.':'❌ Incorrect.'}</b> Your answer: <b>${esc(p.selected)}</b>. Correct answer: <b>${esc(q.correct)}</b>. ${zh?`<div class="explain"><div class="label">中文解析</div>${esc(q.explanation_zh||'')}</div><div class="tags">${q.category?`<span class="tag">${esc(q.category)}</span>`:''}${q.risk?`<span class="tag">风险：${esc(q.risk)}</span>`:''}${q.vocab?`<span class="tag">生词：${esc(q.vocab)}</span>`:''}</div>`:''}</div>`}
  document.getElementById('question-container').innerHTML=`<div class="card"><div class="cardhead"><div class="qmeta"><b>Question #${q.id}</b>${q.category?`<span class="badge">${esc(categoryLabel(q.category,zh))}</span>`:''}</div>${locked&&!isExamMode?`<button class="btn" onclick="resetQuestion(${q.id})">🔄 Redo</button>`:''}</div><div class="body">${imageHTML}<div class="question-en">${esc(q.question_en)}</div>${zh?`<div class="question-zh">${esc(q.question_zh||'')}</div>`:''}<div class="options">${options}</div>${feedback}<div style="margin-top:14px;color:#9ca3af;font-size:11px">Keyboard: <kbd>A</kbd> <kbd>B</kbd> <kbd>C</kbd> <kbd>D</kbd> · <kbd>←</kbd> <kbd>→</kbd></div></div></div>`;
  document.getElementById('prev').disabled=isExamMode||listIndex===0;document.getElementById('next').disabled=listIndex>=currentList.length-1;document.getElementById('indicator').textContent=`${listIndex+1} / ${currentList.length}`;if(!isExamMode)document.getElementById('jump').value=listIndex;document.getElementById('main').scrollTop=0;
}
function renderEmpty(){document.getElementById('question-container').innerHTML='<div class="empty"><h3>No questions in this view.</h3><p>Change the filter or topic.</p></div>';document.getElementById('indicator').textContent='0 / 0';document.getElementById('prev').disabled=true;document.getElementById('next').disabled=true}
function answer(id,L){const q=qById(id);if(isExamMode){examAnswers[id]=L;renderCurrent();return} if(progress[id]?.status)return; const ok=L===q.correct;progress[id]={status:ok?'correct':'wrong',selected:L,answeredAt:new Date().toISOString()};save();updateStats();renderSelector();renderCurrent();if(ok)setTimeout(()=>{if(listIndex<currentList.length-1)nextQuestion()},450)}
function resetQuestion(id){delete progress[id];save();updateStats();renderSelector();renderCurrent()}
function prevQuestion(){if(!isExamMode&&listIndex>0){listIndex--;renderCurrent()}}
function nextQuestion(){if(listIndex<currentList.length-1){listIndex++;renderCurrent()}}
function jumpToQuestion(v){if(isExamMode)return;listIndex=Number(v)||0;renderCurrent()}
function updateStats(){let c=0,w=0;Object.values(progress).forEach(p=>p.status==='correct'?c++:p.status==='wrong'?w++:0);document.getElementById('correct-count').textContent=c;document.getElementById('wrong-count').textContent=w}

function toggleExamMode(){
 if(!isExamMode){if(!currentList.length)return;if(!confirm('Exam mode: answers are hidden until you submit. Previous-question navigation is disabled. Start now?'))return;isExamMode=true;examAnswers={};document.getElementById('btn-exam').textContent='🛑 Submit Exam';document.getElementById('filter').disabled=true;document.getElementById('jump').disabled=true;document.getElementById('category').disabled=true;document.getElementById('stats').classList.add('hidden');renderCurrent()}
 else finishExam();
}
function finishExam(){const ids=Object.keys(examAnswers);if(!ids.length){alert('No answers yet.');exitExam();return}let correct=0,m=[];ids.forEach(id=>{const q=qById(id),sel=examAnswers[id],ok=sel===q.correct;if(ok)correct++;else m.push({q,sel});progress[id]={status:ok?'correct':'wrong',selected:sel,answeredAt:new Date().toISOString()}});save();updateStats();const pct=Math.round(correct/ids.length*100);document.getElementById('exam-score').textContent=pct+'%';document.getElementById('exam-summary').textContent=`${correct} correct / ${ids.length} answered`;const zh=showZh();document.getElementById('mistakes').innerHTML=m.length?'<h3 style="color:#b91c1c">❌ Mistakes</h3>'+m.map(x=>`<div class="mistake"><b>Q${x.q.id}. ${esc(x.q.question_en)}</b>${zh?`<div style="margin-top:5px">${esc(x.q.question_zh)}</div>`:''}<div style="margin-top:8px">Your answer: <b style="color:#dc2626">${esc(x.sel)}</b> · Correct: <b style="color:#16a34a">${esc(x.q.correct)}</b></div>${zh?`<div style="margin-top:6px;color:#4b5563">${esc(x.q.explanation_zh||'')}</div>`:''}</div>`).join(''):'<div class="feedback good">🎉 All correct!</div>';document.getElementById('exam-modal').classList.remove('hidden');exitExam();applyFilter(currentFilter)}
function exitExam(){isExamMode=false;document.getElementById('btn-exam').textContent='🎓 Exam Mode';document.getElementById('filter').disabled=false;document.getElementById('jump').disabled=false;document.getElementById('category').disabled=false;document.getElementById('stats').classList.remove('hidden')}
function closeExamModal(){document.getElementById('exam-modal').classList.add('hidden')}

function exportProgress(){const blob=new Blob([JSON.stringify({app:'uk-driving-wrong-questions',version:2,exportedAt:new Date().toISOString(),progress},null,2)],{type:'application/json'});downloadBlob(blob,`uk_driving_progress_${new Date().toISOString().slice(0,10)}.json`)}
function importProgress(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);progress=d.progress||d||{};save();updateStats();applyFilter(currentFilter);alert('Progress imported.')}catch{alert('Invalid progress file.')}e.target.value=''};r.readAsText(f)}
function exportWrongQuestions(){const items=QUESTIONS.filter(q=>progress[q.id]?.status==='wrong').map(q=>({...q,user_selected:progress[q.id].selected}));if(!items.length){alert('No wrong answers in the current progress.');return}downloadBlob(new Blob([JSON.stringify(items,null,2)],{type:'application/json'}),`uk_driving_wrong_${new Date().toISOString().slice(0,10)}.json`)}
function downloadBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},300)}
function clearProgress(){if(confirm('Clear all saved progress?')){progress={};localStorage.removeItem(STORAGE_KEY);updateStats();applyFilter('all')}}

document.addEventListener('keydown',e=>{if(document.getElementById('exam-modal').classList.contains('hidden')===false)return;if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName))return;const k=e.key.toUpperCase();if(LETTERS.includes(k)&&currentList.length){answer(QUESTIONS[currentList[listIndex]].id,k)}else if(e.key==='ArrowLeft')prevQuestion();else if(e.key==='ArrowRight')nextQuestion()});
window.addEventListener('beforeunload',()=>{settings.img=showImg();saveSettings()});
init();
</script>
</body>
</html>
