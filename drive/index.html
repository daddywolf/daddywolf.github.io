<!DOCTYPE html>
<html lang="en">
<head>

<title>UK Driving Theory Wrong Questions Practice</title>
<style>
:root{--blue:#2563eb;--blue2:#eff6ff;--green:#16a34a;--red:#dc2626;--amber:#d97706;--purple:#7c3aed;--bg:#f3f4f6;--card:#fff;--text:#1f2937;--muted:#6b7280;--border:#e5e7eb}
*{box-sizing:border-box} html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}
body{display:flex;flex-direction:column;overflow:hidden}.hidden{display:none!important}
header{background:#fff;box-shadow:0 1px 8px rgba(0,0,0,.06);z-index:10;flex:0 0 auto}.wrap{max-width:900px;margin:auto;padding-left:16px;padding-right:16px}
.topbar{min-height:62px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--border)}
.brand{font-weight:800;color:var(--blue);font-size:18px}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn,select,.toggle{border:1px solid #d1d5db;background:#fff;border-radius:9px;padding:8px 10px;font-size:14px}.btn{cursor:pointer;font-weight:700}.btn:hover{filter:brightness(.98)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.exam{background:#eef2ff;color:#4338ca;border-color:#c7d2fe}.btn.danger{background:#fef2f2;color:#b91c1c;border-color:#fecaca}
.toggle{display:flex;align-items:center;gap:7px;font-weight:700;cursor:pointer;user-select:none}.toggle input{width:17px;height:17px;accent-color:var(--blue)}
.toolbar{display:grid;grid-template-columns:160px 1fr 180px auto;gap:8px;align-items:center;padding-top:9px;padding-bottom:9px;background:#f9fafb;border-bottom:1px solid var(--border)}
.stats{font-size:12px;color:var(--muted);text-align:right;line-height:1.6;white-space:nowrap}.stats b{font-size:13px}.green{color:var(--green)}.red{color:var(--red)}
main{flex:1 1 auto;overflow:auto;padding:18px 0 36px}.card{background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:0 2px 12px rgba(0,0,0,.04);overflow:hidden}.cardhead{background:var(--blue2);border-bottom:1px solid #dbeafe;padding:12px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:#1e40af}.qmeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.badge{background:#fff;border:1px solid #bfdbfe;border-radius:999px;padding:3px 8px;color:#1d4ed8}.body{padding:20px 22px 24px}.question-en{font-size:21px;font-weight:800;line-height:1.45;margin-bottom:10px}.question-zh{font-size:17px;font-weight:700;line-height:1.55;margin:6px 0 18px;padding-left:12px;border-left:4px solid #cbd5e1;color:#374151}
.imagebox{margin:2px 0 18px;background:#111827;border-radius:12px;overflow:hidden;text-align:center;border:1px solid #d1d5db}.imagebox img{max-width:100%;max-height:520px;display:block;margin:auto;background:#fff}.image-caption{padding:7px 10px;color:#d1d5db;font-size:12px;background:#111827}
.options{display:flex;flex-direction:column;gap:11px}.option{width:100%;text-align:left;border:2px solid var(--border);border-radius:13px;padding:14px 15px;background:#fff;display:flex;align-items:flex-start;gap:12px;cursor:pointer;transition:.12s;font-size:16px;line-height:1.45;color:#374151}.option:hover{border-color:#93c5fd;background:#f8fbff}.option:disabled{cursor:default}.letter{font-weight:900;font-size:18px;min-width:24px}.opt-en{font-weight:650}.opt-zh{margin-top:4px;color:#4b5563;font-size:14px}.option.selected{background:#dbeafe;border-color:#3b82f6}.option.correct{background:#dcfce7;border-color:#22c55e;color:#166534}.option.wrong{background:#fee2e2;border-color:#ef4444;color:#991b1b}.option.dim{opacity:.48;background:#f9fafb}
.feedback{margin-top:18px;border-radius:12px;padding:14px 16px;font-size:14px;line-height:1.55}.feedback.good{background:#f0fdf4;border:1px solid #bbf7d0;color:#166534}.feedback.bad{background:#fef2f2;border:1px solid #fecaca;color:#991b1b}.explain{margin-top:10px;background:#fff;border:1px solid rgba(0,0,0,.08);padding:12px;border-radius:10px;color:#374151}.explain .label{font-weight:800;color:#92400e}.tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.tag{font-size:12px;border-radius:999px;padding:4px 8px;background:#f3f4f6;color:#4b5563;border:1px solid #e5e7eb}
.empty{text-align:center;padding:70px 20px;background:#fff;border:1px dashed #d1d5db;border-radius:14px;color:#6b7280}.data-panel{padding-top:12px;padding-bottom:12px;border-bottom:1px solid var(--border);background:#fff}.data-panel .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.hint{font-size:12px;color:#6b7280;margin-bottom:8px}
footer{flex:0 0 auto;background:#fff;border-top:1px solid var(--border);box-shadow:0 -2px 10px rgba(0,0,0,.03)}.foot{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding-top:10px;padding-bottom:10px}.foot .right{text-align:right}.indicator{font-size:13px;font-weight:800;color:#6b7280}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.58);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}.modalbox{background:#fff;width:min(700px,100%);max-height:88vh;border-radius:16px;overflow:hidden;display:flex;flex-direction:column}.modalhead{background:#4f46e5;color:#fff;padding:15px 18px;display:flex;justify-content:space-between;align-items:center}.modalbody{overflow:auto;padding:20px;background:#f9fafb}.score{text-align:center;background:#fff;border:1px solid var(--border);padding:20px;border-radius:14px;margin-bottom:16px}.score .num{font-size:48px;font-weight:900;color:#4f46e5}.mistake{background:#fff;border:1px solid #fecaca;border-radius:12px;padding:13px;margin:10px 0}.modalfoot{padding:12px 16px;border-top:1px solid var(--border);text-align:right}
kbd{background:#f3f4f6;border:1px solid #d1d5db;border-bottom-width:2px;border-radius:5px;padding:1px 5px;font-size:11px;color:#4b5563}
@media(max-width:760px){.toolbar{grid-template-columns:1fr 1fr}.toolbar select:nth-child(2){grid-column:1/3}.stats{text-align:left}.question-en{font-size:19px}.body{padding:17px 15px 21px}.option{padding:12px}.topbar{padding-top:8px;padding-bottom:8px}.controls{width:100%}.controls .toggle{flex:1;justify-content:center}.controls .btn{flex:1}.imagebox img{max-height:420px}}
</style>
</head>
<body>
<header>
  <div class="wrap topbar">
    <div class="brand">🚗 UK Driving Theory Wrong Questions</div>
    <div class="controls">
      <label class="toggle" title="Unchecked: English questions/options only. Checked: show Chinese translation and explanation."><input id="toggle-zh" type="checkbox" onchange="setChinese(this.checked)"> 中文翻译</label>
      <label class="toggle"><input id="toggle-img" type="checkbox" checked onchange="renderCurrent()"> Original screenshot</label>
      <button id="btn-exam" class="btn exam" onclick="toggleExamMode()">🎓 Exam Mode</button>
      <button class="btn" onclick="toggleDataPanel()">💾 Data</button>
    </div>
  </div>
  <div class="wrap toolbar">
    <select id="filter" onchange="applyFilter(this.value)">
      <option value="all">All questions</option><option value="todo">Unanswered</option><option value="wrong">📌 Wrong answers</option><option value="correct">Correct answers</option>
    </select>
    <select id="jump" onchange="jumpToQuestion(this.value)"></select>
    <select id="category" onchange="setCategory(this.value)"><option value="all">All topics</option></select>
    <div id="stats" class="stats">✅ <b id="correct-count" class="green">0</b> &nbsp; ❌ <b id="wrong-count" class="red">0</b></div>
  </div>
  <div id="data-panel" class="hidden data-panel"><div class="wrap">
    <div class="hint">Progress is stored in this browser. Export it if you want a backup or to move it to another computer.</div>
    <div class="row">
      <button class="btn primary" onclick="exportProgress()">⬇️ Export progress</button>
      <label class="btn" style="position:relative;overflow:hidden">⬆️ Import progress<input id="import-file" type="file" accept=".json" onchange="importProgress(event)" style="position:absolute;inset:0;opacity:0;cursor:pointer"></label>
      <button class="btn" onclick="exportWrongQuestions()">📦 Export wrong answers</button>
      <button class="btn danger" onclick="clearProgress()">⚠️ Clear progress</button>
    </div>
  </div></div>
</header>
<main id="main"><div class="wrap" id="question-container"></div></main>
<footer><div class="wrap foot"><div><button id="prev" class="btn" onclick="prevQuestion()">⬅️ Previous</button></div><div class="indicator" id="indicator">0 / 0</div><div class="right"><button id="next" class="btn primary" onclick="nextQuestion()">Next ➡️</button></div></div></footer>
<div id="exam-modal" class="modal hidden"><div class="modalbox"><div class="modalhead"><b>📊 Exam Result</b><button class="btn" onclick="closeExamModal()">✕</button></div><div class="modalbody"><div class="score"><div id="exam-score" class="num">0%</div><div id="exam-summary"></div></div><div id="mistakes"></div></div><div class="modalfoot"><button class="btn primary" onclick="closeExamModal()">Close</button></div></div></div>
<script>
const QUESTIONS = [{"id":1,"file":"Screenshot 2026-08-14 at 23.09.07.png","question_en":"What shape are traffic signs giving orders?","options_en":[">","[Image option 2]","[Image option 3]","[Image option 4]"],"correct":"D","question_zh":"发出指令（必须遵守）的交通标志通常是什么形状？","options_zh":["图形选项1","图形选项2","图形选项3","图形选项4"],"correct_zh":"图形选项4","explanation_zh":"正确答案：图形选项4。指令类标志通常是圆形；视觉题要把形状先记牢。","category":"交通标志/标线/信号","risk":"数字/单位记忆；视觉识别","vocab":""},{"id":2,"file":"Screenshot 2026-08-14 at 23.09.10.png","question_en":"What should you do when you're passing loose sheep on the road?","options_en":["Briefly sound your horn","Go very slowly","Pass quickly but quietly","Herd them to the side of the road"],"correct":"B","question_zh":"在道路上经过散放的羊群时，你应该怎么做？","options_zh":["短促鸣笛","非常缓慢地通过","快速但安静地通过","把羊赶到路边"],"correct_zh":"非常缓慢地通过","explanation_zh":"正确答案：非常缓慢地通过。羊群可能受惊，核心是非常慢地通过，不要鸣笛催赶。","category":"弱势道路使用者/风险感知","risk":"安全原则/风险判断","vocab":""},{"id":3,"file":"Screenshot 2026-08-14 at 23.09.11.png","question_en":"What should you do before making a U-turn?","options_en":["Give an arm signal as well as using your indicators","Check road markings to see that U-turns are permitted","Look over your shoulder for a final check","Select a higher gear than normal"],"correct":"C","question_zh":"掉头（U-turn）前你应该做什么？","options_zh":["除打转向灯外再做手势","查看道路标线，确认允许掉头","最后一次回头越肩检查盲区","挂比平时更高的挡位"],"correct_zh":"最后一次回头越肩检查盲区","explanation_zh":"正确答案：最后一次回头越肩检查盲区。掉头前最后要做越肩检查，防止盲区里的骑行者/摩托车。","category":"车辆控制/机械常识","risk":"中国驾驶习惯迁移风险；视觉识别","vocab":""},{"id":4,"file":"Screenshot 2026-08-14 at 23.09.13.png","question_en":"You have stopped in an emergency area. What must you do before you rejoin the carriageway?","options_en":["Use the emergency telephone","Give an arm signal as you're moving off","Switch on your vehicle's headlights","Move away with your hazard lights on"],"correct":"A","question_zh":"你停在高速公路的紧急停车区后，重新驶入主车道前必须做什么？","options_zh":["使用紧急电话","起步时打手势","打开车辆前照灯","开着危险警示灯驶离"],"correct_zh":"使用紧急电话","explanation_zh":"正确答案：使用紧急电话。紧急停车区重新驶出前要用紧急电话按指示处理；不要自己直接冲回车流。","category":"高速公路/车道纪律","risk":"视觉识别；生词/术语","vocab":"carriageway=车行道/主车道；emergency area=紧急停车区；emerge=从支路驶出"},{"id":5,"file":"Screenshot 2026-08-14 at 23.09.15.png","question_en":"What does this sign mean?","options_en":["Through traffic to use left lane","Right-hand lane T-junction only","Right-hand lane closed ahead","11 tonne weight limit"],"correct":"C","question_zh":"这个标志表示什么？","options_zh":["直行车辆使用左侧车道","右侧车道只能去T形路口","前方右侧车道关闭","11吨限重"],"correct_zh":"前方右侧车道关闭","explanation_zh":"正确答案：前方右侧车道关闭。这是视觉记忆题，别靠语感。把“形状+颜色+线型+灯序”成组背，尤其是红圈、三角警告、黄线、红X和反光道钉。","category":"交通标志/标线/信号","risk":"数字/单位记忆；视觉识别","vocab":""},{"id":6,"file":"Screenshot 2026-08-14 at 23.09.17.png","question_en":"What do the white diagonal stripe markings in the middle of the road mean?","options_en":["No overtaking","You must not enter the area unless it's an emergency","You should not enter the area unless it's necessary and you can see it's safe","It's an overtaking area for motorcyclists"],"correct":"C","question_zh":"道路中央的白色斜纹区域表示什么？","options_zh":["禁止超车","除紧急情况外绝对不得进入","除非确有必要且确认安全，否则不应进入","摩托车专用超车区"],"correct_zh":"除非确有必要且确认安全，否则不应进入","explanation_zh":"正确答案：除非确有必要且确认安全，否则不应进入。考试会默认行人、骑行者、摩托车、老人和动物可能突然改变路线。正确倾向通常是减速、留空间、不要催促。","category":"弱势道路使用者/风险感知","risk":"生词/术语；安全原则/风险判断","vocab":"mot=车辆年检（MOT）；emerge=从支路驶出"},{"id":7,"file":"Screenshot 2026-08-14 at 23.09.19.png","question_en":"Why is there a warning 'Reduce speed now'?","options_en":["Traffic is merging from the left","There's a T-junction ahead","There's a crossroads and a double bend ahead","There's a staggered junction ahead"],"correct":"C","question_zh":"为什么这里会有“Reduce speed now（立即减速）”警告？","options_zh":["左侧有车辆汇入","前方有T形路口","前方有十字路口和连续两个弯道","前方有错位路口"],"correct_zh":"前方有十字路口和连续两个弯道","explanation_zh":"正确答案：前方有十字路口和连续两个弯道。这是视觉记忆题，别靠语感。把“形状+颜色+线型+灯序”成组背，尤其是红圈、三角警告、黄线、红X和反光道钉。","category":"交通标志/标线/信号","risk":"生词/术语","vocab":"staggered junction=错位路口"},{"id":8,"file":"Screenshot 2026-08-14 at 23.09.21.png","question_en":"What hazard do you need to look out for as you drive under the bridge?","options_en":["Pedestrians walking in the road","Overhanging tree branches","A narrowing of the road","The height of the bridge"],"correct":"A","question_zh":"从桥下通过时，需要特别留意什么危险？","options_zh":["行人可能走在车道上","低垂的树枝","道路变窄","桥梁限高"],"correct_zh":"行人可能走在车道上","explanation_zh":"正确答案：行人可能走在车道上。考试会默认行人、骑行者、摩托车、老人和动物可能突然改变路线。正确倾向通常是减速、留空间、不要催促。","category":"弱势道路使用者/风险感知","risk":"安全原则/风险判断","vocab":""},{"id":9,"file":"Screenshot 2026-08-14 at 23.09.24.png","question_en":"What restrictions apply if you're towing a trailer on a three-lane motorway?","options_en":["You must not exceed 50 mph","You must not overtake","You must have a stabiliser fitted","You must not use the right-hand lane"],"correct":"D","question_zh":"在三车道高速公路上牵引拖车时，有什么限制？","options_zh":["车速不得超过50 mph","不得超车","必须安装稳定器","不得使用最右侧车道"],"correct_zh":"不得使用最右侧车道","explanation_zh":"正确答案：不得使用最右侧车道。三车道高速牵引拖车时不能使用最右侧车道。","category":"拖车/牵引规则","risk":"数字/单位记忆；生词/术语；英国特有规则","vocab":"stabiliser=拖车稳定器；mot=车辆年检（MOT）；towing=牵引"},{"id":10,"file":"Screenshot 2026-08-14 at 23.09.25.png","question_en":"What does this sign mean?","options_en":["Two-way traffic straight ahead","Two-way traffic crosses a one-way road","Two-way traffic over a bridge","Two-way traffic crosses a two-way road"],"correct":"B","question_zh":"这个标志表示什么？","options_zh":["前方双向交通","双向道路横穿一条单行道","桥上双向交通","双向道路横穿另一条双向道路"],"correct_zh":"双向道路横穿一条单行道","explanation_zh":"正确答案：双向道路横穿一条单行道。这是视觉记忆题，别靠语感。把“形状+颜色+线型+灯序”成组背，尤其是红圈、三角警告、黄线、红X和反光道钉。","category":"交通标志/标线/信号","risk":"视觉识别","vocab":""},{"id":11,"file":"Screenshot 2026-08-14 at 23.09.28.png","question_en":"What should you do if you're being followed by an ambulance showing flashing blue lights?","options_en":["Pull over as soon as it's safe to do so","Accelerate hard to get away from it","Maintain your speed and course","Brake harshly and stop well out into the road"],"correct":"A","question_zh":"如果后方有闪蓝灯的救护车跟随，你应该怎么做？","options_zh":["在安全时尽快靠边让行","猛加速拉开距离","保持原速度和路线","急刹并停在车道内"],"correct_zh":"在安全时尽快靠边让行","explanation_zh":"正确答案：在安全时尽快靠边让行。给急救车辆让行的关键词是“在安全时尽快靠边”，不是急刹或加速逃离。","category":"车辆控制/机械常识","risk":"中国驾驶习惯迁移风险；生词/术语","vocab":"pull over=靠边让行/停车"},{"id":12,"file":"Screenshot 2026-08-14 at 23.09.30.png","question_en":"What's likely to happen if you use a hands-free phone while you're driving?","options_en":["It will improve your safety","It will increase your concentration","It will reduce your view","It will divert your attention"],"correct":"D","question_zh":"驾驶时使用免提电话最可能造成什么影响？","options_zh":["提高安全性","提高注意力","缩小视野","分散注意力"],"correct_zh":"分散注意力","explanation_zh":"正确答案：分散注意力。优先选择风险更低、可预期性更高、不会替其他道路使用者做决定的做法。","category":"一般安全驾驶","risk":"规则理解","vocab":""},{"id":13,"file":"Screenshot 2026-08-14 at 23.09.32.png","question_en":"You've been driving in fog. What must you do when the visibility improves?","options_en":["Switch off your fog lights","Keep your rear fog lights switched on","Keep your front fog lights switched on","Leave your fog lights switched on in case the fog returns"],"correct":"A","question_zh":"在雾中驾驶后，能见度改善时你必须做什么？","options_zh":["关闭雾灯","继续开后雾灯","继续开前雾灯","继续开雾灯以防雾再次出现"],"correct_zh":"关闭雾灯","explanation_zh":"正确答案：关闭雾灯。恶劣天气题通常更保守：减速、增大距离、正确用灯。灯光题重点区分近光/远光/雾灯/停车灯，以及何时会晃到别人。","category":"天气/灯光/能见度","risk":"生词/术语","vocab":"rear fog lights=后雾灯"},{"id":14,"file":"Screenshot 2026-08-14 at 23.09.34.png","question_en":"As you approach the roundabout, there's a sign showing a single white bar on a green background. What does this sign tell you?","options_en":["There are chevrons on the roundabout","The roundabout is 50 yards ahead","The roundabout is 100 yards ahead","Give way at the roundabout"],"correct":"C","question_zh":"接近环岛时看到绿色背景上的一条白色横杠，这表示什么？","options_zh":["环岛上有V形导向标（chevrons）","环岛在前方50码","环岛在前方100码","环岛处让行"],"correct_zh":"环岛在前方100码","explanation_zh":"正确答案：环岛在前方100码。这是视觉记忆题，别靠语感。把“形状+颜色+线型+灯序”成组背，尤其是红圈、三角警告、黄线、红X和反光道钉。","category":"交通标志/标线/信号","risk":"数字/单位记忆；视觉识别；生词/术语","vocab":"chevrons=V形导向标；give way=让行"},{"id":15,"file":"Screenshot 2026-08-14 at 23.09.36.png","question_en":"Why should you never wave people across at pedestrian crossings?","options_en":["Another vehicle may be coming","They may not be looking","It's safer for you to carry on","They may not be ready to cross"],"correct":"A","question_zh":"为什么在行人过街处不应该挥手示意行人过马路？","options_zh":["可能还有其他车辆驶来","行人可能没在看","你继续开更安全","行人可能还没准备好过马路"],"correct_zh":"可能还有其他车辆驶来","explanation_zh":"正确答案：可能还有其他车辆驶来。你挥手只能代表你这辆车，不代表其他车道也安全。","category":"行人过街设施","risk":"中国驾驶习惯迁移风险","vocab":""},{"id":16,"file":"Screenshot 2026-08-14 at 23.09.38.png","question_en":"You're on a motorway. What should you do if there's a red cross showing on the signs above your lane only?","options_en":["Continue in that lane and look for further information","Do not continue in that lane","Pull onto the hard shoulder","Stop and wait for an instruction to proceed"],"correct":"B","question_zh":"你在高速公路上，如果你所在车道上方显示红色叉号（red X），应该怎么做？","options_zh":["继续在该车道行驶并等待后续信息","不得继续使用该车道","驶上硬路肩","停车等待进一步指示"],"correct_zh":"不得继续使用该车道","explanation_zh":"正确答案：不得继续使用该车道。单个车道上方红X=该车道关闭，必须离开。","category":"高速公路/车道纪律","risk":"中国驾驶习惯迁移风险；视觉识别；生词/术语","vocab":"hard shoulder=硬路肩；mot=车辆年检（MOT）"},{"id":17,"file":"Screenshot 2026-08-14 at 23.09.40.png","question_en":"What does this curved arrow road marking mean?","options_en":["Heavy vehicles should take the next road on the left to avoid a weight limit","The road ahead bends to the left","Overtaking traffic should move back to the left","The road ahead has a camber to the left"],"correct":"C","question_zh":"路面上的弯曲箭头标线表示什么？","options_zh":["大型车辆应在下一个左转口离开以避开限重","前方道路向左弯","正在超车的车辆应回到左侧","前方道路向左侧横坡倾斜"],"correct_zh":"正在超车的车辆应回到左侧","explanation_zh":"正确答案：正在超车的车辆应回到左侧。这是视觉记忆题，别靠语感。把“形状+颜色+线型+灯序”成组背，尤其是红圈、三角警告、黄线、红X和反光道钉。","category":"交通标志/标线/信号","risk":"视觉识别；生词/术语","vocab":"camber=道路横坡"},{"id":18,"file":"Screenshot 2026-08-14 at 23.09.42.png","question_en":"Your vehicle has broken down on a motorway. In which direction should you walk to find the nearest emergency telephone?","options_en":["With the traffic flow","Facing oncoming traffic","In the direction shown on the marker posts","In the direction of the nearest exit"],"correct":"C","question_zh":"车辆在高速公路上故障后，应往哪个方向走才能找到最近的紧急电话？","options_zh":["顺着车流方向走","面向迎面车流方向走","按路边标志桩上的箭头方向走","朝最近出口方向走"],"correct_zh":"按路边标志桩上的箭头方向走","explanation_zh":"正确答案：按路边标志桩上的箭头方向走。高速故障找紧急电话时跟着 marker posts 上的箭头走。","category":"高速公路/车道纪律","risk":"视觉识别；生词/术语","vocab":"marker posts=路边标志桩；mot=车辆年检（MOT）；emerge=从支路驶出"},{"id":19,"file":"Screenshot 2026-08-14 at 23.09.44.png","question_en":"Where may you overtake on a one-way street?","options_en":["Only on the left-hand side","Overtaking is not allowed","Only on the right-hand side","On either the right or the left"],"correct":"D","question_zh":"在单行道上可以从哪一侧超车？","options_zh":["只能从左侧","禁止超车","只能从右侧","左右两侧都可以"],"correct_zh":"左右两侧都可以","explanation_zh":"正确答案：左右两侧都可以。单行道在条件允许时可从左或右超车；这和普通道路默认超右不同。","category":"路口/环岛/超车","risk":"中国驾驶习惯迁移风险","vocab":""},{"id":20,"file":"Screenshot 2026-08-14 at 23.09.46.png","question_en":"When do windscreen pillars cause a serious obstruction to your view?","options_en":["When you're driving on a motorway","When you're driving on a dual carriageway","When you're approaching a one-way street","When you're approaching bends and junctions"],"correct":"D","question_zh":"挡风玻璃A柱在什么时候最容易严重遮挡视线？","options_zh":["高速公路行驶时","双车道分隔道路上行驶时","接近单行道时","接近弯道和路口时"],"correct_zh":"接近弯道和路口时","explanation_zh":"正确答案：接近弯道和路口时。英国高速的底层逻辑是“默认靠左，右侧主要用于超车”。红X、硬路肩、紧急停车区和并入高速都有专门规则。","category":"高速公路/车道纪律","risk":"生词/术语","vocab":"carriageway=车行道/主车道；dual carriageway=双车道分隔道路；mot=车辆年检（MOT）；windscreen pillars=挡风玻璃A柱"},{"id":21,"file":"Screenshot 2026-08-14 at 23.09.48.png","question_en":"Who should obey diamond-shaped traffic signs? 30","options_en":["Tram drivers","Bus drivers","Lorry drivers","Taxi drivers"],"correct":"A","question_zh":"菱形交通标志主要是给谁遵守的？","options_zh":["有轨电车司机","公交车司机","货车司机","出租车司机"],"correct_zh":"有轨电车司机","explanation_zh":"正确答案：有轨电车司机。这是视觉记忆题，别靠语感。把“形状+颜色+线型+灯序”成组背，尤其是红圈、三角警告、黄线、红X和反光道钉。","category":"交通标志/标线/信号","risk":"数字/单位记忆","vocab":""},{"id":22,"file":"Screenshot 2026-08-14 at 23.09.50.png","question_en":"Which driving technique can help you save fuel?","options_en":["Using lower gears as often as possible","Accelerating sharply in each gear","Using each gear in turn","Missing out some gears"],"correct":"D","question_zh":"哪种驾驶方法有助于省油？","options_zh":["尽量多使用低挡","每个挡位都急加速","按顺序把每个挡位都用一遍","适当跳挡换挡"],"correct_zh":"适当跳挡换挡","explanation_zh":"正确答案：适当跳挡换挡。抓住“控制力”这个核心：ABS要持续有力制动；下坡用低挡+谨慎制动；冰雪高挡低扭矩；离合/空挡滑行会降低控制。","category":"车辆控制/机械常识","risk":"规则理解","vocab":""},{"id":23,"file":"Screenshot 2026-08-14 at 23.09.51.png","question_en":"You wish to turn right ahead. Why should you take up the correct position in good time?","options_en":["To allow other drivers to pull out in front of you","To give a better view into the road that you're joining","To help other road users know what you intend to do","To allow drivers to pass you on the right"],"correct":"C","question_zh":"前方准备右转，为什么要尽早进入正确车道位置？","options_zh":["让其他司机可以在你前面驶出","让你更容易看清要进入的道路","让其他道路使用者知道你的意图","让其他司机从你右侧通过"],"correct_zh":"让其他道路使用者知道你的意图","explanation_zh":"正确答案：让其他道路使用者知道你的意图。英国路口题非常重视观察、车道位置和让行。不要把中国的“右侧快车道/抢空隙/挥手示意”直觉直接套过来。","category":"路口/环岛/超车","risk":"中国驾驶习惯迁移风险","vocab":""},{"id":24,"file":"Screenshot 2026-08-14 at 23.09.53.png","question_en":"The conditions are good and dry. When should you use the 'two-second rule'?","options_en":["Before restarting the engine after it has stalled","When checking your gap from the vehicle in front","Before using the 'Mirrors - Signal - Manoeuvre' routine","When traffic lights change to green"],"correct":"B","question_zh":"天气和路面状况良好、干燥时，“两秒规则”用于什么？","options_zh":["发动机熄火后重新启动前","检查与前车的跟车距离","执行“后视镜-信号-操作”流程前","交通灯变绿时"],"correct_zh":"检查与前车的跟车距离","explanation_zh":"正确答案：检查与前车的跟车距离。两秒规则就是测跟车距离；湿滑时要进一步增加。","category":"交通标志/标线/信号","risk":"视觉识别","vocab":""},{"id":25,"file":"Screenshot 2026-08-14 at 23.09.55.png","question_en":"You're carrying an 11-year-old child on the front seat of your car. They're under 1.35 metres (4 feet 5 inches) tall. What seat belt security must be in place?","options_en":["They must use an adult seat belt","They must be able to fasten their own seat belt","They must use a suitable child restraint","They must be able to see clearly out of the front window"],"correct":"C","question_zh":"11岁儿童坐在前排，身高低于1.35米，必须使用什么约束装置？","options_zh":["成人安全带","必须能自己系安全带","合适的儿童约束装置/儿童座椅","必须能清楚看到前挡风玻璃外"],"correct_zh":"合适的儿童约束装置/儿童座椅","explanation_zh":"正确答案：合适的儿童约束装置/儿童座椅。这道题考儿童身高/年龄对应的儿童约束装置，不是成人安全带是否“能系上”。","category":"英国法规/证件/行政","risk":"数字/单位记忆；英国特有规则","vocab":""},{"id":26,"file":"Screenshot 2026-08-14 at 23.09.59.png","question_en":"What type of emergency vehicle is fitted with a green flashing beacon?","options_en":["Fire engine","Road gritter","Ambulance","Doctor's car"],"correct":"D","question_zh":"哪种应急车辆会使用绿色闪灯？","options_zh":["消防车","撒盐/除冰车","救护车","医生车辆"],"correct_zh":"医生车辆","explanation_zh":"正确答案：医生车辆。优先选择风险更低、可预期性更高、不会替其他道路使用者做决定的做法。","category":"一般安全驾驶","risk":"生词/术语","vocab":"road gritter=撒盐/除冰车；emerge=从支路驶出；beacon=警示闪灯"},{"id":27,"file":"Screenshot 2026-08-14 at 23.10.01.png","question_en":"Where would you see this sign?","options_en":["In the window of a car taking children to school","At the side of the road","At playground areas","On the rear of a school bus or coach"],"correct":"D","question_zh":"你会在哪里看到这个标志？","options_zh":["接送儿童上学的小汽车车窗上","道路旁","游乐场区域","校车或学校大巴后部"],"correct_zh":"校车或学校大巴后部","explanation_zh":"正确答案：校车或学校大巴后部。恶劣天气题通常更保守：减速、增大距离、正确用灯。灯光题重点区分近光/远光/雾灯/停车灯，以及何时会晃到别人。","category":"天气/灯光/能见度","risk":"规则理解","vocab":""},{"id":28,"file":"Screenshot 2026-08-14 at 23.10.03.png","question_en":"Which type of crossing allows cyclists to ride across with pedestrians?","options_en":["Toucan","Puffin","Pelican","Zebra"],"correct":"A","question_zh":"哪一种行人过街设施允许骑自行车的人与行人一起骑行通过？","options_zh":["Toucan crossing（行人+自行车）","Puffin crossing","Pelican crossing","Zebra crossing（斑马线）"],"correct_zh":"Toucan crossing（行人+自行车）","explanation_zh":"正确答案：Toucan crossing（行人+自行车）。Toucan 可联想“two can cross”：行人和自行车都能过。","category":"行人过街设施","risk":"生词/术语","vocab":"pelican=Pelican 行人过街设施；puffin=Puffin 智能行人过街设施；toucan=Toucan 行人+自行车过街设施；zebra=斑马线"},{"id":29,"file":"Screenshot 2026-08-14 at 23.10.05.png","question_en":"What's the speed limit for the car towing the caravan on this road?","options_en":["60 mph","70 mph","50 mph","40 mph"],"correct":"A","question_zh":"这条道路上，牵引旅行拖车（caravan）的汽车限速是多少？","options_zh":["60 mph","70 mph","50 mph","40 mph"],"correct_zh":"60 mph","explanation_zh":"正确答案：60 mph。拖挂题不要凭普通小汽车经验猜。把专门限速、最右车道限制、MAM/noseweight 和安全连接装置当成独立知识点背。","category":"拖车/牵引规则","risk":"数字/单位记忆；生词/术语；英国特有规则","vocab":"towing=牵引"},{"id":30,"file":"Screenshot 2026-08-14 at 23.10.07.png","question_en":"When may you overtake another vehicle on their left?","options_en":["When you're in a one-way street","When approaching a motorway slip road where you'll be turning off","When the vehicle in front is signalling to turn left","When a slower vehicle is travelling in the right-hand lane of a dual carriageway"],"correct":"A","question_zh":"什么时候可以从另一辆车的左侧超车？","options_zh":["在单行道上","接近高速出口匝道且你将驶离高速时","前车打左转向灯时","双车道分隔道路上有慢车占用右侧车道时"],"correct_zh":"在单行道上","explanation_zh":"正确答案：在单行道上。英国高速的底层逻辑是“默认靠左，右侧主要用于超车”。红X、硬路肩、紧急停车区和并入高速都有专门规则。","category":"高速公路/车道纪律","risk":"中国驾驶习惯迁移风险；生词/术语","vocab":"carriageway=车行道/主车道；slip road=匝道；dual carriageway=双车道分隔道路；mot=车辆年检（MOT）"},{"id":31,"file":"Screenshot 2026-08-14 at 23.10.09.png","question_en":"What should you do when you see an older person about to cross the road ahead?","options_en":["Expect them to wait for you to pass","Speed up to get past them quickly","Stop and wave them across the road","Be careful; they may misjudge your speed"],"correct":"D","question_zh":"看到前方有老年人准备过马路时，你应该怎么做？","options_zh":["认为他会等你通过","加速快速通过","停车并挥手让他过","小心，因为他可能误判你的车速"],"correct_zh":"小心，因为他可能误判你的车速","explanation_zh":"正确答案：小心，因为他可能误判你的车速。考试会默认行人、骑行者、摩托车、老人和动物可能突然改变路线。正确倾向通常是减速、留空间、不要催促。","category":"弱势道路使用者/风险感知","risk":"中国驾驶习惯迁移风险；安全原则/风险判断","vocab":""},{"id":32,"file":"Screenshot 2026-08-14 at 23.10.11.png","question_en":"Which colour follows the green signal at a puffin crossing?","options_en":["Steady red","Flashing amber","Steady amber","Flashing green"],"correct":"C","question_zh":"Puffin crossing 的绿灯之后会亮什么灯？","options_zh":["常亮红灯","闪烁黄灯","常亮黄灯","闪烁绿灯"],"correct_zh":"常亮黄灯","explanation_zh":"正确答案：常亮黄灯。Puffin 的车辆信号绿灯之后是常亮黄灯，不是 Pelican 的闪黄逻辑。","category":"行人过街设施","risk":"生词/术语","vocab":"puffin=Puffin 智能行人过街设施"},{"id":33,"file":"Screenshot 2026-08-14 at 23.10.12.png","question_en":"You're waiting in a traffic queue at night. How can you avoid dazzling drivers behind you?","options_en":["Use the parking brake and release the footbrake","Keep your foot on the footbrake","Balance the clutch with the accelerator","Use the parking brake and footbrake together"],"correct":"A","question_zh":"夜间在车流中排队时，怎样避免刹车灯晃到后车司机？","options_zh":["拉手刹并松开脚刹","一直踩住脚刹","用离合器和油门保持车辆不动","同时使用手刹和脚刹"],"correct_zh":"拉手刹并松开脚刹","explanation_zh":"正确答案：拉手刹并松开脚刹。抓住“控制力”这个核心：ABS要持续有力制动；下坡用低挡+谨慎制动；冰雪高挡低扭矩；离合/空挡滑行会降低控制。","category":"车辆控制/机械常识","risk":"规则理解","vocab":""},{"id":34,"file":"Screenshot 2026-08-14 at 23.10.14.png","question_en":"When are you not allowed to sound your vehicle's horn?","options_en":["Between 10pm and 6am in a built-up area","At any time in a built-up area","Between 11:30pm and 7am in a built-up area","Between 11:30pm and 6am on any road"],"correct":"C","question_zh":"在什么时间不得在建成区（built-up area）鸣笛？","options_zh":["晚上10点到早上6点","建成区任何时间都不能","晚上11:30到早上7点","任何道路晚上11:30到早上6点"],"correct_zh":"晚上11:30到早上7点","explanation_zh":"正确答案：晚上11:30到早上7点。建成区夜间禁鸣笛时段是 23:30–07:00；这是典型英国死记规则。","category":"英国法规/证件/行政","risk":"中国驾驶习惯迁移风险；数字/单位记忆；生词/术语；英国特有规则","vocab":"built-up area=建成区"},{"id":35,"file":"Screenshot 2026-08-14 at 23.10.16.png","question_en":"What should you do to avoid fuel spillage?","options_en":["Check that your tank is only three-quarters full","Check that you've used a locking filler cap","Check that your fuel gauge is working","Check that your filler cap is securely fastened"],"correct":"D","question_zh":"怎样避免燃油泄漏？","options_zh":["油箱只加到四分之三","使用可上锁的油箱盖","确认油表正常工作","确认油箱盖已牢固拧紧"],"correct_zh":"确认油箱盖已牢固拧紧","explanation_zh":"正确答案：确认油箱盖已牢固拧紧。抓住“控制力”这个核心：ABS要持续有力制动；下坡用低挡+谨慎制动；冰雪高挡低扭矩；离合/空挡滑行会降低控制。","category":"车辆控制/机械常识","risk":"规则理解","vocab":""},{"id":36,"file":"Screenshot 2026-08-14 at 23.10.18.png","question_en":"You arrive at the scene of a motorcycle crash. The rider is injured. When should their helmet be removed?","options_en":["Only when it's essential","Always straight away","Only when the motorcyclist asks","Always, unless they're in shock"],"correct":"A","question_zh":"摩托车事故中骑手受伤，什么时候才应该摘下其头盔？","options_zh":["只有在确有必要时","一定要立刻摘下","只有骑手要求时","除非休克，否则都要摘"],"correct_zh":"只有在确有必要时","explanation_zh":"正确答案：只有在确有必要时。考试会默认行人、骑行者、摩托车、老人和动物可能突然改变路线。正确倾向通常是减速、留空间、不要催促。","category":"弱势道路使用者/风险感知","risk":"生词/术语；安全原则/风险判断","vocab":"mot=车辆年检（MOT）"},{"id":37,"file":"Screenshot 2026-08-14 at 23.10.20.png","question_en":"Which vehicle will use a blue flashing beacon?","options_en":["Motorway maintenance","Bomb disposal","Snow plough","Breakdown recovery"],"correct":"B","question_zh":"哪种车辆会使用蓝色闪灯？","options_zh":["高速公路维护车","排爆车辆","扫雪车","道路救援车"],"correct_zh":"排爆车辆","explanation_zh":"正确答案：排爆车辆。英国高速的底层逻辑是“默认靠左，右侧主要用于超车”。红X、硬路肩、紧急停车区和并入高速都有专门规则。","category":"高速公路/车道纪律","risk":"生词/术语","vocab":"mot=车辆年检（MOT）；beacon=警示闪灯"},{"id":38,"file":"Screenshot 2026-08-14 at 23.10.23.png","question_en":"What must you do when the amber light is flashing at a pelican crossing?","options_en":["Stop and wait for the green light","Stop and wait for the red light","Give way to pedestrians waiting to cross","Give way to pedestrians already on the crossing"],"correct":"D","question_zh":"Pelican crossing 的黄灯闪烁时，你必须怎么做？","options_zh":["停车等绿灯","停车等红灯","让准备过街的行人先行","让已经在过街设施上的行人先行"],"correct_zh":"让已经在过街设施上的行人先行","explanation_zh":"正确答案：让已经在过街设施上的行人先行。Pelican 闪黄灯：先让已经在斑马区域上的行人；如果没人，可以继续。","category":"行人过街设施","risk":"中国驾驶习惯迁移风险；生词/术语","vocab":"pelican=Pelican 行人过街设施；give way=让行"},{"id":39,"file":"Screenshot 2026-08-14 at 23.10.25.png","question_en":"What should you do if you're driving a slow-moving vehicle on a narrow winding road?","options_en":["Keep well out to stop vehicles overtaking dangerously","Wave the vehicles behind to come past you if you think they can overtake quickly","Pull in when you can, to let the vehicles behind overtake","Give a left signal when it's safe for vehicles to overtake you"],"correct":"C","question_zh":"在狭窄弯曲道路上驾驶慢速车辆时，应该怎么做？","options_zh":["尽量靠外行驶，阻止后车危险超车","如果你觉得后车能快速超车，就挥手示意它们通过","有机会时靠边，让后车超车","在安全时打左转向灯示意后车超车"],"correct_zh":"有机会时靠边，让后车超车","explanation_zh":"正确答案：有机会时靠边，让后车超车。恶劣天气题通常更保守：减速、增大距离、正确用灯。灯光题重点区分近光/远光/雾灯/停车灯，以及何时会晃到别人。","category":"天气/灯光/能见度","risk":"中国驾驶习惯迁移风险","vocab":""},{"id":40,"file":"Screenshot 2026-08-14 at 23.10.27.png","question_en":"What's the purpose of a catalytic converter?","options_en":["To reduce fuel consumption","To reduce the risk of fire","To reduce harmful exhaust gases","To reduce engine wear"],"correct":"C","question_zh":"三元催化转换器（catalytic converter）的作用是什么？","options_zh":["降低油耗","降低起火风险","减少有害尾气排放","减少发动机磨损"],"correct_zh":"减少有害尾气排放","explanation_zh":"正确答案：减少有害尾气排放。抓住“控制力”这个核心：ABS要持续有力制动；下坡用低挡+谨慎制动；冰雪高挡低扭矩；离合/空挡滑行会降低控制。","category":"车辆控制/机械常识","risk":"生词/术语","vocab":"catalytic converter=三元催化转换器"},{"id":41,"file":"Screenshot 2026-08-14 at 23.10.29.png","question_en":"How much more fuel will you use by driving at 70 mph, compared with driving at 50 mph?","options_en":["About 5%","About 15%","About 75%","About 100%"],"correct":"B","question_zh":"以70 mph行驶相比50 mph，大约会多耗多少燃油？","options_zh":["约5%","约15%","约75%","约100%"],"correct_zh":"约15%","explanation_zh":"正确答案：约15%。70 mph 对比 50 mph，大约多耗 15% 燃油。","category":"车辆控制/机械常识","risk":"数字/单位记忆","vocab":""},{"id":42,"file":"Screenshot 2026-08-14 at 23.10.31.png","question_en":"What's the legal minimum tread depth for tyres on your trailer or caravan?","options_en":["1 mm","1.6 mm","2 mm","2.6 mm"],"correct":"B","question_zh":"拖车或旅行拖车轮胎的法定最小胎纹深度是多少？","options_zh":["1 mm","1.6 mm","2 mm","2.6 mm"],"correct_zh":"1.6 mm","explanation_zh":"正确答案：1.6 mm。拖车/旅行拖车轮胎最小胎纹深度 1.6 mm。","category":"拖车/牵引规则","risk":"数字/单位记忆；生词/术语；英国特有规则","vocab":"tread depth=胎纹深度"},{"id":43,"file":"Screenshot 2026-08-14 at 23.10.33.png","question_en":"A casualty is not breathing normally and needs cardiopulmonary resuscitation (CPR). At what rate should you press down and release on the centre of their chest?","options_en":["10 times per minute","120 times per minute","60 times per minute","240 times per minute"],"correct":"B","question_zh":"伤员呼吸不正常，需要进行CPR。胸外按压和回弹的频率应是多少？","options_zh":["每分钟10次","每分钟120次","每分钟60次","每分钟240次"],"correct_zh":"每分钟120次","explanation_zh":"正确答案：每分钟120次。题库给的 CPR 频率是每分钟 120 次，可直接记成约每秒 2 次。","category":"应急处置/急救","risk":"数字/单位记忆；安全原则/风险判断","vocab":""},{"id":44,"file":"Screenshot 2026-08-14 at 23.10.34.png","question_en":"What does it mean if your vehicle keeps bouncing after you sharply press down and release on the bodywork over a wheel?","options_en":["The tyres are worn","The tyres are under inflated","The vehicle is on soft ground","The shock absorbers are worn"],"correct":"D","question_zh":"在车轮上方用力按压车身后松开，车辆仍反复弹跳，说明什么？","options_zh":["轮胎磨损","轮胎气压不足","车辆停在松软地面","减震器磨损"],"correct_zh":"减震器磨损","explanation_zh":"正确答案：减震器磨损。抓住“控制力”这个核心：ABS要持续有力制动；下坡用低挡+谨慎制动；冰雪高挡低扭矩；离合/空挡滑行会降低控制。","category":"车辆控制/机械常识","risk":"生词/术语","vocab":"shock absorbers=减震器"},{"id":45,"file":"Screenshot 2026-08-14 at 23.10.36.png","question_en":"You're approaching traffic lights and the red light is showing. What signal will show next?","options_en":["Red and amber","Green alone","Amber alone","Green and amber"],"correct":"A","question_zh":"接近交通灯时当前为红灯，接下来会显示什么？","options_zh":["红灯和黄灯同时亮","只亮绿灯","只亮黄灯","绿灯和黄灯同时亮"],"correct_zh":"红灯和黄灯同时亮","explanation_zh":"正确答案：红灯和黄灯同时亮。英国普通交通灯从红灯下一步是“红+黄”，然后才绿。","category":"交通标志/标线/信号","risk":"视觉识别","vocab":""},{"id":46,"file":"Screenshot 2026-08-14 at 23.10.38.png","question_en":"What can cause excessive or uneven tyre wear?","options_en":["A faulty gearbox","A faulty braking system","A faulty electrical system","A faulty exhaust system"],"correct":"B","question_zh":"什么会导致轮胎过度或不均匀磨损？","options_zh":["变速箱故障","制动系统故障","电气系统故障","排气系统故障"],"correct_zh":"制动系统故障","explanation_zh":"正确答案：制动系统故障。抓住“控制力”这个核心：ABS要持续有力制动；下坡用低挡+谨慎制动；冰雪高挡低扭矩；离合/空挡滑行会降低控制。","category":"车辆控制/机械常识","risk":"规则理解","vocab":""},{"id":47,"file":"Screenshot 2026-08-14 at 23.10.40.png","question_en":"You're driving a car that has a diesel engine. What can a loose filler cap on your fuel tank cause?","options_en":["It can make the engine difficult to start","It can make the roads slippery for other road users","It can improve your vehicle's fuel consumption","It can increase the level of exhaust emissions"],"correct":"B","question_zh":"驾驶柴油车时，油箱盖松动可能造成什么？","options_zh":["发动机难以启动","燃油洒到路面，使其他道路使用者打滑","改善车辆油耗","增加尾气排放"],"correct_zh":"燃油洒到路面，使其他道路使用者打滑","explanation_zh":"正确答案：燃油洒到路面，使其他道路使用者打滑。抓住“控制力”这个核心：ABS要持续有力制动；下坡用低挡+谨慎制动；冰雪高挡低扭矩；离合/空挡滑行会降低控制。","category":"车辆控制/机械常识","risk":"规则理解","vocab":""},{"id":48,"file":"Screenshot 2026-08-14 at 23.10.42.png","question_en":"What colour are the reflective studs between the lanes on a motorway?","options_en":["Green","Amber","White","Red"],"correct":"C","question_zh":"高速公路车道之间的反光道钉是什么颜色？","options_zh":["绿色","琥珀色/黄色","白色","红色"],"correct_zh":"白色","explanation_zh":"正确答案：白色。高速车道之间的反光道钉是白色。","category":"高速公路/车道纪律","risk":"视觉识别；生词/术语","vocab":"reflective studs=反光道钉；mot=车辆年检（MOT）"},{"id":49,"file":"Screenshot 2026-08-14 at 23.10.44.png","question_en":"How can you avoid wheelspin when you're driving on an icy road?","options_en":["Drive at a slow speed in the highest gear possible","Use the parking brake if the wheels start to slip","Brake gently and repeatedly","D y=让行"},{"id":53,"file":"Screenshot 2026-08-14 at 23.10.51.png","question_en":"Which type of glasses would make driving at night more difficult?","options_en":["Half-moon","Round","Bifocal","Tinted"],"correct":"D","question_zh":"哪种眼镜会让夜间驾驶更困难？","options_zh":["半月形眼镜","圆形眼镜","双焦点眼镜","有色/染色镜片眼镜"],"correct_zh":"有色/染色镜片眼镜","explanation_zh":"正确答案：有色/染色镜片眼镜。恶劣天气题通常更保守：减速、增大距离、正确用灯。灯光题重点区分近光/远光/雾灯/停车灯，以及何时会晃到别人。","category":"天气/灯光/能见度","risk":"规则理解","vocab":""},{"id":54,"file":"Screenshot 2026-08-14 at 23.10.53.png","question_en":"Where would you see a contraflow bus lane?","options_en":["On a dual carriageway","On a roundabout","On an urban motorway","On a one-way street"],"correct":"D","question_zh":"在哪里会看到逆向公交专用道（contraflow bus lane）？","options_zh":["双车道分隔道路","环岛","城市高速公路","单行道"],"correct_zh":"单行道","explanation_zh":"正确答案：单行道。英国高速的底层逻辑是“默认靠左，右侧主要用于超车”。红X、硬路肩、紧急停车区和并入高速都有专门规则。","category":"高速公路/车道纪律","risk":"中国驾驶习惯迁移风险；生词/术语","vocab":"carriageway=车行道/主车道；dual carriageway=双车道分隔道路；contraflow=逆向车流；mot=车辆年检（MOT）"},{"id":55,"file":"Screenshot 2026-08-14 at 23.10.55.png","question_en":"You're parked on the road at night. When must you use parking lights?","options_en":["When there are continuous white lines in the middle of the road","When the speed limit exceeds 30 mph","When you're facing oncoming traffic","When you're near a bus stop"],"correct":"B","question_zh":"夜间把车停在道路上时，什么情况下必须开停车灯（parking lights）？","options_zh":["道路中央有连续白线时","道路限速超过30 mph时","车头朝向迎面车流时","靠近公交站时"],"correct_zh":"道路限速超过30 mph时","explanation_zh":"正确答案：道路限速超过30 mph时。夜间停车且道路限速超过 30 mph，需要开启停车灯。","category":"天气/灯光/能见度","risk":"中国驾驶习惯迁移风险；数字/单位记忆；视觉识别；生词/术语","vocab":"parking lights=停车灯"},{"id":56,"file":"Screenshot 2026-08-14 at 23.10.57.png","question_en":"Which type of vehicle should you be ready to give way to as you approach this bridge?","options_en":["Bicycles","Buses","Motorcycles","Cars"],"correct":"B","question_zh":"接近这座桥时，你应准备给哪种车辆让行？","options_zh":["自行车","公交车","摩托车","小汽车"],"correct_zh":"公交车","explanati us to keep the clutch down, or select neutral, for long periods of time while you're driving?","options_en":["Fuel spillage will occur","Engine damage may be caused","You'll have less steering and braking control","It will wear tyres out more quickly"],"correct":"C","question_zh":"驾驶时长时间踩下离合器或挂空挡为什么危险？","options_zh":["会导致燃油泄漏","可能损坏发动机","转向和制动控制会变差","轮胎会更快磨损"],"correct_zh":"转向和制动控制会变差","explanation_zh":"正确答案：转向和制动控制会变差。长时间踩离合或空挡滑行会减少发动机制动，降低转向/制动控制。","category":"车辆控制/机械常识","risk":"规则理解","vocab":""},{"id":85,"file":"Screenshot 2026-08-14 at 23.11.59.png","question_en":"You're turning right onto a dual carriageway. What should you do before emerging?","options_en":["Stop, apply the parking brake and then select a low gear","Position your vehicle well to the left of the side road","Check that the central reservation is wide enough for your vehicle","Make sure that you leave enough room for a vehicle behind"],"correct":"C","question_zh":"从支路右转驶入双车道分隔道路前，应先做什么？","options_zh":["停车、拉手刹，再挂低挡","把车辆尽量靠支路左侧","确认中央隔离带足够宽，能容纳你的车","给后车留出足够空间"],"correct_zh":"确认中央隔离带足够宽，能容纳你的车","explanation_zh":"正确答案：确认中央隔离带足够宽，能容纳你的车。抓住“控制力”这个核心：ABS要持续有力制动；下坡用低挡+谨慎制动；冰雪高挡低扭矩；离合/空挡滑行会降低控制。","category":"车辆控制/机械常识","risk":"中国驾驶习惯迁移风险；生词/术语","vocab":"carriageway=车行道/主车道；central reservation=中央隔离带；dual carriageway=双车道分隔道路"},{"id":86,"file":"Screenshot 2026-08-14 at 23.12.01.png","question_en":"You see these double white lines along the centre of the road. When may you park on the left?","options_en":["If the line nearest to you is broken","When there are no yellow lines","To pick up or set down passengers","During daylight hours only"],"correct":"C","question_zh":"道路中央有双白线时，什么时候可以在左侧停车？","options_zh":["靠你一侧的白线是虚线时","没有黄线时","上下乘客时","仅限白天"],"correct_zh":"上下乘客时","explanation_zh":"正确答案：上下乘客时。这是视觉记忆题，别靠语感。把“形状+颜色+线型+灯序”成组背，尤其是红圈、三角警告、黄线、红X和反光道钉。","category":"交通标志/标线/信号","risk":"中国驾驶习惯迁移风险；视觉识别","vocab":""},{"id":87,"file":"Screenshot 2026-08-14 at 23.12.02.png","question_en":"What's the maximum fine for driving or riding without insurance?","options_en":["Unlimited","£500","£1,000","€5,000"],"correct":"A","question_zh":"无保险驾驶/骑行，最高罚款是多少？","options_zh":["无上限","£500","£1,000","€5,000"],"correct_zh":"无上限","explanation_zh":"正确答案：无上限。题库答案：无保险驾驶的最高罚款可无上限。","category":"英国法规/证件/行政","risk":"数字/单位记忆；英国特有规则","vocab":""},{"id":88,"file":"Screenshot 2026-08-14 at 23.12.04.png","question_en":"What should you do when you leave your car unattended for a few minutes?","options_en":["Leave the engine running","Switch the engine off but leave the key in","Lock it and remove the key","Park near a traffic warden"],"correct":"C","question_zh":"离开车辆几分钟且无人看管时应该怎么做？","options_zh":["让发动机继续运转","关闭发动机但把钥匙留在车内","锁车并取走钥匙","停在交通管理员附近"],"correct_zh":"锁车并取走钥匙","explanation_zh":"正确答案：锁车并取走钥匙。这是英国本地规则，和你会不会开车几乎无关。建议把机构名、年限、罚则、MOT/SORN/保险规则做成“死记卡片”。","category":"英国法规/证件/行政","risk":"英国特有规则","vocab":""},{"id":89,"file":"Screenshot 2026-08-14 at 23.12.06.png","question_en":"Other than direction indicators, how can you give signals to other road users?","options_en":["By using brake lights","By using sidelights","By using fog lights","By using interior lights"],"correct":"A","question_zh":"除了转向灯，还可以用什么向其他道路使用者传递信号？","options_zh":["刹车灯","示宽灯/侧灯","雾灯","车内灯"],"correct_zh":"刹车灯","explanation_zh":"正确答案：刹车灯。抓住“控制力”这个核心：ABS要持续有力制动；下坡用低挡+谨慎制动；冰雪高挡低扭矩；离合/空挡滑行会降低控制。","category":"车辆控制/机械常识","risk":"生词/术语","vocab":"sidelights=示宽灯/侧灯"},{"id":90,"file":"Screenshot 2026-08-14 at 23.12.08.png","question_en":"What's the main hazard you should be aware of when following this cyclist?","options_en":["The cyclist may move to the left and dismount","The cyclist may swerve into the road","The cyclist may get off and push their bicycle","The cyclist may wish to turn right at the end of the road"],"correct":"B","question_zh":"跟在这名骑自行车的人后面时，最主要的危险是什么？","options_zh":["骑行者可能向左移动并下车","骑行者可能突然摆入车道","骑行者可能下车推行","骑行者可能在道路尽头右转"],"correct_zh":"骑行者可能突然摆入车道","explanation_zh":"正确答案：骑行者可能突然摆入车道。考试会默认行人、骑行者、摩托车、老人和动物可能突然改变路线。正确倾向通常是减速、留空间、不要催促。","category":"弱势道路使用者/风险感知","risk":"中国驾驶习惯迁移风险；生词/术语；安全原则/风险判断","vocab":"dismount=下车/下自行车"},{"id":91,"file":"Screenshot 2026-08-14 at 23.12.10.png","question_en":"How should you use anti-lock brakes when you need to stop in an emergency?","options_en":["Keep pumping the footbrake to prevent skidding","Brake normally but grip the steering wheel tightly","Brake promptly and firmly until you've stopped","Apply the parking brake to reduce the stopping distance"],"correct":"C","question_zh":"紧急情况下使用ABS制动时，应怎样操作？","options_zh":["反复点踩脚刹防止打滑","正常刹车但紧握方向盘","迅速而有力地持续踩刹车直到停车","拉手刹以缩短停车距离"],"correct_zh":"迅速而有力地持续踩刹车直到停车","explanation_zh":"正确答案：迅速而有力地持续踩刹车直到停车。有 ABS 的紧急制动：迅速、坚定、持续踩刹车，不要点刹。","category":"车辆控制/机械常识","risk":"生词/术语","vocab":"skidding=打滑；emerge=从支路驶出"},{"id":92,"file":"Screenshot 2026-08-14 at 23.12.12.png","question_en":"When will a new car need its first MOT test?","options_en":["When it's one year old","When it's 3 years old","When it's 5 years old","When it's 7 years old"],"correct":"B","question_zh":"新车什么时候第一次需要做MOT？","options_zh":["车龄1年","车龄3年","车龄5年","车龄7年"],"correct_zh":"车龄3年","explanation_zh":"正确答案：车龄3年。题库规则：新车通常 3 年后做第一次 MOT。","category":"英国法规/证件/行政","risk":"数字/单位记忆；生词/术语；英国特有规则","vocab":"mot=车辆年检（MOT）"},{"id":93,"file":"Screenshot 2026-08-14 at 23.12.14.png","question_en":"What's the speed limit for a car towing a trailer on a motorway?","options_en":["40 mph","50 mph","60 mph","70 mph"],"correct":"C","question_zh":"汽车在高速公路上牵引拖车时限速是多少？","options_zh":["40 mph","50 mph","60 mph","70 mph"],"correct_zh":"60 mph","explanation_zh":"正确答案：60 mph。汽车牵引拖车在高速公路限速 60 mph。","category":"拖车/牵引规则","risk":"数字/单位记忆；生词/术语；英国特有规则","vocab":"mot=车辆年检（MOT）；towing=牵引"},{"id":94,"file":"Screenshot 2026-08-14 at 23.12.16.png","question_en":"What does this sign mean? 10%","options_en":["Adverse camber","Steep hill downwards","Uneven road","Steep hill upwards"],"correct":"B","question_zh":"这个“10%”标志表示什么？","options_zh":["不利横坡（adverse camber）","前方陡下坡","路面不平","前方陡上坡"],"correct_zh":"前方陡下坡", lane","As an overtaking lane","As a right-turn lane","As an acceleration lane"],"correct":"B","question_zh":"三车道高速公路的最右侧车道应怎样使用？","options_zh":["作为高速车道","作为超车道","作为右转车道","作为加速车道"],"correct_zh":"作为超车道","explanation_zh":"正确答案：作为超车道。最右侧车道是超车道，不是“高速车道”。","category":"高速公路/车道纪律","risk":"中国驾驶习惯迁移风险；生词/术语","vocab":"mot=车辆年检（MOT）"},{"id":120,"file":"Screenshot 2026-08-14 at 23.13.05.png","question_en":"How will a police officer in a patrol vehicle signal for you to stop?","options_en":["Flash the headlights, indicate left and point to the left","Overtake and give a slowing down arm signal","Use the siren, overtake, cut in front and stop","Pull alongside you, use the siren and wave you to stop"],"correct":"A","question_zh":"巡逻警车会怎样示意你停车？","options_zh":["闪前灯、打左转向灯并向左指","超车后做减速手势","鸣警笛、超车、切到你前方并停车","与车并行、鸣警笛并挥手让你停车"],"correct_zh":"闪前灯、打左转向灯并向左指","explanation_zh":"正确答案：闪前灯、打左转向灯并向左指。恶劣天气题通常更保守：减速、增大距离、正确用灯。灯光题重点区分近光/远光/雾灯/停车灯，以及何时会晃到别人。","category":"天气/灯光/能见度","risk":"中国驾驶习惯迁移风险；视觉识别","vocab":""},{"id":121,"file":"Screenshot 2026-08-14 at 23.13.07.png","question_en":"Why should you allow extra room while overtaking a motorcyclist on a windy day?","options_en":["The rider may turn off suddenly to get out of the wind","The rider may be blown in front of you","The rider may stop suddenly","The rider may be travelling faster than normal"],"correct":"B","question_zh":"大风天超越摩托车时，为什么要留更大横向间距？","options_zh":["骑手可能突然转弯躲风","骑手可能被风吹到你车前","骑手可能突然停车","骑手可能比平时骑得更快"],"correct_zh":"骑手可能被风吹到你车前","explanation_zh":"正确答案：骑手可能被风吹到你车前。考试会默认行人、骑行者、摩托车、老人和动物可能突然改变路线。正确倾向通常是减速、留空间、不要催促。","category":"弱势道路使用者/风险感知","risk":"中国驾驶习惯迁移风险；生词/术语；安全原则/风险判断","vocab":"mot=车辆年检（MOT）"},{"id":122,"file":"Screenshot 2026-08-14 at 23.13.08.png","question_en":"What does this sign mean?","options_en":["No overtaking","No motor vehicles","Clearway (no stopping)","Cars and motorcycles only"],"correct":"B","question_zh":"这个标志表示什么？","options_zh":["禁止超车","禁止机动车","Clearway（禁止停车）","只允许小汽车和摩托车"],"correct_zh":"禁止机动车","explanation_zh":"正确答案：禁止机动车。这是视觉记忆题，别靠语感。把“形状+颜色+线型+灯序”成组背，尤其是红圈、三角警告、黄线、红X和反光道钉。","category":"交通标志/标线/信号","risk":"视觉识别；生词/术语","vocab":"clearway=禁止停车道路；mot=车辆年检（MOT）"},{"id":123,"file":"Screenshot 2026-08-14 at 23.13.10.png","question_en":"Which sign means you have priority over oncoming vehicles?","options_en":["TTi","[Image option 2]","T","[Image option 4]"],"correct":"B","question_zh":"哪个标志表示你对迎面车辆有优先权？","options_zh":["图形选项1","图形选项2","图形选项3","图形选项4"],"correct_zh":"图形选项2","explanation_zh":"正确答案：图形选项2。这是视觉记忆题，别靠语感。把“形状+颜色+线型+灯序”成组背，尤其是红圈、三角警告、黄线、红X和反光道钉。","category":"交通标志/标线/信号","risk":"数字/单位记忆；视觉识别","vocab":""},{"id":124,"file":"Screenshot 2026-08-14 at 23.13.12.png","question_en":"What must you do when you're overtaking a car at night?","options_en":["Flash your headlights before overtaking","Select a higher gear","Switch your headlights to main beam before overtaking","Make sure you do not dazzle other road users"],"correct":"D","question_zh":"夜间超越一辆汽车时必须注意什么？","options_zh":["超车前闪前灯","挂更高挡位","超车前切换到远光灯","确保不要让其他道路使用者被你的灯光晃眼"],"correct_zh":"确保不要让其他道路使用者被你的灯光晃眼","explanation_zh":"正确答案：确保不要让其他道路使用者被你的灯光晃眼。抓住“控制力”这个核心：ABS要持续有力制动；下坡用低挡+谨慎制动；冰雪高挡低扭矩；离合/空挡滑行会降低控制。","category":"车辆控制/机械常识","risk":"中国驾驶习惯迁移风险；生词/术语","vocab":"main beam=远光灯；dazzle=晃眼/眩目"},{"id":125,"file":"Screenshot 2026-08-14 at 23.13.14.png","question_en":"You're on a motorway. What must you do if there's a red cross showing above every lane?","options_en":["Pull onto the hard shoulder","Slow down and watch for further signals","Leave at the next exit","Stop and wait"],"correct":"D","question_zh":"在高速公路上，如果所有车道上方都显示红色叉号（red X），你必须怎么做？","options_zh":["驶上硬路肩","减速并观察后续信号","从下一个出口离开","停车等待"],"correct_zh":"停车等待","explanation_zh":"正确答案：停车等待。所有车道都显示红X时，题库答案是停车等待。","category":"高速公路/车道纪律","risk":"中国驾驶习惯迁移风险；视觉识别；生词/术语","vocab":"hard shoulder=硬路肩；mot=车辆年检（MOT）"},{"id":126,"file":"Screenshot 2026-08-14 at 23.13.16.png","question_en":"You've driven up to a pelican crossing. What must you do while the amber light is flashing?","options_en":["Signal the pedestrian to cross","Always wait for the green light before proceeding","Give way to any pedestrians on the crossing","Wait for the red-and-amber light before proceeding"],"correct":"C","question_zh":"驶到Pelican crossing时，黄灯闪烁期间你必须怎么做？","options_zh":["示意行人过街","始终等到绿灯再通过","让已经在过街设施上的行人先行","等红黄灯同时亮再通过"],"correct_zh":"让已经在过街设施上的行人先行","explanation_zh":"正确答案：让已经在过街设施上的行人先行。Pelican 闪黄灯仍然优先让已经在过街设施上的行人。","category":"行人过街设施","risk":"中国驾驶习惯迁移风险；生词/术语","vocab":"pelican=Pelican 行人过街设施；give way=让行"},{"id":127,"file":"Screenshot 2026-08-14 at 23.13.17.png","question_en":"What helps to reduce traffic bunching on a motorway?","options_en":["Variable speed limits","Contraflow systems","National speed limits","Lane closures"],"correct":"A","question_zh":"什么措施有助于减少高速公路上的车流成团（bunching）？","options_zh":["可变限速","逆向车流系统（contraflow）","国家限速","车道关闭"],"correct_zh":"可变限速","explanation_zh":"正确答案：可变限速。英国高速的底层逻辑是“默认靠左，右侧主要用于超车”。红X、硬路肩、紧急停车区和并入高速都有专门规则。","category":"高速公路/车道纪律","risk":"生词/术语","vocab":"contraflow=逆向车流；bunching=车流成团/拥堵波；mot=车辆年检（MOT）"},{"id":128,"file":"Screenshot 2026-08-14 at 23.13.19.png","question_en":"What should you do when dealing with this hazard? Ford","options_en":["Switch on your hazard warning lights","Use a low gear and drive slowly","Use a high gear to prevent wheelspin","Switch on your windscreen wipers"],"correct":"B","question_zh":"遇到这个危险（涉水浅滩/ford）时应该怎么做？","options_zh":["打开危险警示灯","用低挡缓慢通过","用高挡防止车轮空转","打开雨刷"],"correct_zh":"用低挡缓慢通过","explanation_zh":"正确答案：用低挡缓慢通过。抓住“控制力”这个核心：ABS要持续有力制动；下坡用低挡+谨慎制动；冰雪高挡低扭矩；离合/空挡滑行会降低控制。","category":"车辆控制/机械常识","risk":"生词/术语","vocab":"hazard warning lights=危险警示灯；wheelspin=车轮空转；ford=涉水浅滩"},{"id":129,"file":"Screenshot 2026-08-14 at 23.13.21.png","question_en":"When may you drive without wearing your seat belt?","options_en":["When you're carrying out a manoeuvre that includes reversing","When you're moving off on a hill","When you're testing your brakes","When you're driving slowly in queuing traffic"],"correct":"A","question_zh":"什么时候可以不系安全带驾驶？","options_zh":["进行包含倒车的操作时","坡道起步时","测试刹车时","缓慢排队行驶时"],"correct_zh":"进行包含倒车的操作时","explanation_zh":"正确答案：进行包含倒车的操作时。包含倒车的操作属于可不系安全带的法定例外之一。","category":"英国法规/证件/行政","risk":"英国特有规则","vocab":""},{"id":130,"file":"Screenshot 2026-08-14 at 23.13.24.png","question_en":"When should you use the right-hand lane of a three-lane dual carriageway?","options_en":["When you're overtaking only","When you're overtaking or turning right","When you're using cruise control","When you're turning right only"],"correct":"B","question_zh":"三车道双车道分隔道路的最右侧车道什么时候可以使用？","options_zh":["只能超车时","超车或右转时","使用定速巡航时","只能右转时"],"correct_zh":"超车或右转时","explanation_zh":"正确答案：超车或右转时。英国路口题非常重视观察、车道位置和让行。不要把中国的“右侧快车道/抢空隙/挥手示意”直觉直接套过来。","category":"路口/环岛/超车","risk":"中国驾驶习惯迁移风险；生词/术语","vocab":"carriageway=车行道/主车道；dual carriageway=双车道分隔道路"},{"id":131,"file":"Screenshot 2026-08-14 at 23.13.26.png","question_en":"You see this amber traffic light ahead. Which light, or lights, will come on next?","options_en":["Red alone","Red and amber together","Green and amber together","Green alone"],"correct":"A","question_zh":"前方交通灯现在是黄灯，接下来会亮什么？","options_zh":["只亮红灯","红灯和黄灯同时亮","绿灯和黄灯同时亮","只亮绿灯"],"correct_zh":"只亮红灯","explanation_zh":"正确答案：只亮红灯。当前是常亮黄灯，下一步是红灯。","category":"交通标志/标线/信号","risk":"视觉识别","vocab":""},{"id":132,"file":"Screenshot 2026-08-14 at 23.13.28.png","question_en":"The road outside this school is marked with yellow zigzag lines. What do these lines mean?","options_en":["You may park on the lines when dropping off schoolchildren","You may park on the lines when picking up schoolchildren","You should not wait or park your vehicle here","You must stay with your vehicle if you park here"],"correct":"C","question_zh":"学校外道路有黄色锯齿线，这些线表示什么？","options_zh":["接送学生下车时可以停车","接学生上车时可以停车","不应在这里等候或停车","只要人留在车里就可以停车"],"correct_zh":"不应在这里等候或停车","explanation_zh":"正确答案：不应在这里等候或停车。学校黄色锯齿线区域不应停车或等候，接送学生也不是例外。","category":"交通标志/标线/信号","risk":"中国驾驶习惯迁移风险","vocab":""},{"id":133,"file":"Screenshot 2026-08-14 at 23.13.30.png","question_en":"What information would be shown in a triangular road sign?","options_en":["Road narrows","Ahead only","Keep left","Minimum speed"],"correct":"A","question_zh":"三角形道路标志通常提供哪类信息？","options_zh":["道路变窄","只准直行","靠左行驶","最低限速"],"correct_zh":"道路变窄","explanation_zh":"正确答案：道路变窄。这是视觉记忆题，别靠语感。把“形状+颜色+线型+灯序”成组背，尤其是红圈、三角警告、黄线、红X和反光道钉。","category":"交通标志/标线/信号","risk":"规则理解","vocab":""},{"id":134,"file":"Screenshot 2026-08-14 at 23.13.31.png","question_en":"What's the speed limit on this road?","options_en":["30 mph","40 mph","50 mph","60 mph"],"correct":"A","question_zh":"这条道路的限速是多少？","options_zh":["30 mph","40 mph","50 mph","60 mph"],"correct_zh":"30 mph","explanation_zh":"正确答案：30 mph。优先选择风险更低、可预期性更高、不会替其他道路使用者做决定的做法。","category":"一般安全驾驶","risk":"数字/单位记忆","vocab":""},{"id":135,"file":"Screenshot 2026-08-14 at 23.13.33.png","question_en":"What will happen if you hold the clutch pedal down or roll in neutral for too long?","options_en":["It will use more fuel","It will cause the engine to overheat","It will reduce your control","It will improve tyre wear"],"correct":"C","question_zh":"长时间踩住离合器或空挡滑行会有什么后果？","options_zh":["更费油","导致发动机过热","降低对车辆的控制","改善轮胎磨损"],"correct_zh":"降低对车辆的控制","explanation_zh":"正确答案：降低对车辆的控制。抓住“控制力”这个核心：ABS要持续有力制动；下坡用低挡+谨慎制动；冰雪高挡低扭矩；离合/空挡滑行会降低控制。","category":"车辆控制/机械常识","risk":"规则理解","vocab":""},{"id":136,"file":"Screenshot 2026-08-14 at 23.13.35.png","question_en":"When may you stop on a clearway?","options_en":["Never","When it's busy","In the rush hour","During daylight hours"],"correct":"A","question_zh":"什么时候可以在Clearway上停车等候？","options_zh":["任何时候都不可以","交通繁忙时","高峰时段","仅白天"],"correct_zh":"任何时候都不可以","explanation_zh":"正确答案：任何时候都不可以。Clearway 的核心就是禁止停车等候；这类标志按字面功能死记。","category":"交通标志/标线/信号","risk":"中国驾驶习惯迁移风险；生词/术语","vocab":"clearway=禁止停车道路"},{"id":137,"file":"Screenshot 2026-08-14 at 23.13.37.png","question_en":"You wish to tow a trailer. Where would you find the maximum noseweight for your vehicle's tow hitch?","options_en":["In the vehicle handbook","In The Highway Code","In your vehicle registration certificate","In your licence documents"],"correct":"A","question_zh":"准备牵引拖车时，从哪里可以查到车辆拖钩允许的最大垂直载荷（noseweight）？","options_zh":["车辆用户手册","The Highway Code","车辆登记证书","驾驶执照文件"],"correct_zh":"车辆用户手册","explanation_zh":"正确答案：车辆用户手册。拖挂题不要凭普通小汽车经验猜。把专门限速、最右车道限制、MAM/noseweight 和安全连接装置当成独立知识点背。","category":"拖车/牵引规则","risk":"生词/术语；英国特有规则","vocab":"noseweight=拖钩垂直载荷"},{"id":138,"file":"Screenshot 2026-08-14 at 23.13.38.png","question_en":"What colour are the reflective studs along the left-hand edge of the motorway?","options_en":["Green","Amber","Red","White"],"correct":"C","question_zh":"高速公路左侧边缘的反光道钉是什么颜色？","options_zh":["绿色","琥珀色/黄色","红色","白色"],"correct_zh":"红色","explanation_zh":"正确答案：红色。高速最左侧边缘是红色道钉。","category":"高速公路/车道纪律","risk":"视觉识别；生词/术语","vocab":"reflective studs=反光道钉；mot=车辆年检（MOT）"},{"id":139,"file":"Screenshot 2026-08-14 at 23.13.40.png","question_en":"How is bunching reduced on motorways?","options_en":["By using higher speed limits","By using advisory speed limits","By using minimum speed limits","By using variable speed limits"],"correct":"D","question_zh":"高速公路上怎样减少车流成团（bunching）？","options_zh":["提高限速","使用建议速度","使用最低限速","使用可变限速"],"correct_zh":"使用可变限速","explanation_zh":"正确答案：使用可变限速。英国高速的底层逻辑是“默认靠左，右侧主要用于超车”。红X、硬路肩、紧急停车区和并入高速都有专门规则。","category":"高速公路/车道纪律","risk":"生词/术语","vocab":"bunching=车流成团/拥堵波；mot=车辆年检（MOT）"},{"id":140,"file":"Screenshot 2026-08-14 at 23.13.42.png","question_en":"How should you signal if you're going straight ahead at a roundabout?","options_en":["Signal right on the approach and then left to leave the roundabout","Signal left after you leave the roundabout and enter the new road","Signal right on the approach to the roundabout and keep the signal on","Signal left just after you pass the exit before the one you're going to take"],"correct":"D","question_zh":"在环岛直行时应该怎样打转向灯？","options_zh":["接近环岛时打右灯，离开时打左灯","离开环岛进入新道路后再打左灯","接近环岛时一直打右灯","经过你要驶出出口之前的那个出口后，打左转向灯"],"correct_zh":"经过你要驶出出口之前的那个出口后，打左转向灯","explanation_zh":"正确答案：经过你要驶出出口之前的那个出口后，打左转向灯。环岛直行通常接近时不打右灯；经过前一个出口后再打左灯准备驶出。","category":"交通标志/标线/信号","risk":"中国驾驶习惯迁移风险","vocab":""},{"id":141,"file":"Screenshot 2026-08-14 at 23.13.44.png","question_en":"What does it mean if your trailer has a maximum authorised mass (MAM) of 3,500 kg?","options_en":["Your trailer can carry a load of 3,500 kg","Your empty trailer weighs 3,500 kg","Your trailer and towing vehicle combined cannot weigh more than 3,500 kg","Your trailer and load combined cannot weigh more than 3,500 kg"],"correct":"D","question_zh":"拖车的最大允许质量（MAM）为3,500 kg是什么意思？","options_zh":["拖车最多能装3,500 kg货物","空拖车重3,500 kg","拖车和牵引车合计不得超过3,500 kg","拖车本身加所载货物合计不得超过3,500 kg"],"correct_zh":"拖车本身加所载货物合计不得超过3,500 kg","explanation_zh":"正确答案：拖车本身加所载货物合计不得超过3,500 kg。MAM 指“拖车本身+载荷”的最大允许总质量，不是载荷本身。","category":"拖车/牵引规则","risk":"数字/单位记忆；生词/术语；英国特有规则","vocab":"maximum authorised mass=最大允许质量；towing=牵引"},{"id":142,"file":"Screenshot 2026-08-14 at 23.13.45.png","question_en":"What information is found on a vehicle registration document?","options_en":["The registered keeper","The type of insurance cover","The service history details","The date of the MOT"],"correct":"A","question_zh":"车辆登记文件上会记录什么信息？","options_zh":["登记保管人（registered keeper）","保险类型","保养记录","MOT日期"],"correct_zh":"登记保管人（registered keeper）","explanation_zh":"正确答案：登记保管人（registered keeper）。这是英国本地规则，和你会不会开车几乎无关。建议把机构名、年限、罚则、MOT/SORN/保险规则做成“死记卡片”。","category":"英国法规/证件/行政","risk":"生词/术语；英国特有规则","vocab":"mot=车辆年检（MOT）；registered keeper=登记保管人"},{"id":143,"file":"Screenshot 2026-08-14 at 23.13.47.png","question_en":"You're joining a motorway from a slip road. How should you deal with traffic already on the motorway?","options_en":["Carry on along the hard shoulder until you see a safe gap","Stop at the end of the slip road and look for a safe gap","Use the slip road to accelerate until you're moving much faster than the motorway traffic","Match your speed to traffic in the left-hand lane and filter into a safe gap"],"correct":"D","question_zh":"从匝道驶入高速公路时，应怎样处理高速主路上的车辆？","options_zh":["沿硬路肩继续走直到找到空隙","在匝道末端停车等待空隙","在匝道上加速到远高于高速车流的速度","把速度调整到接近左侧车道车流，并选择安全空隙汇入"],"correct_zh":"把速度调整到接近左侧车道车流，并选择安全空隙汇入","explanation_zh":"正确答案：把速度调整到接近左侧车道车流，并选择安全空隙汇入。上高速要用匝道把速度匹配到左侧车流，再找安全空隙汇入；不要在匝道末端停车等。","category":"高速公路/车道纪律","risk":"中国驾驶习惯迁移风险；生词/术语","vocab":"hard shoulder=硬路肩；slip road=匝道；mot=车辆年检（MOT）"},{"id":144,"file":"Screenshot 2026-08-14 at 23.13.49.png","question_en":"What does this sign mean? 115570","options_en":["Bus station on the right","Contraflow bus lane","With-flow bus lane","Give way to buses"],"correct":"B","question_zh":"这个标志表示什么？","options_zh":["右侧公交车站","逆向公交专用道（contraflow bus lane）","同向公交专用道（with-flow bus lane）","给公交车让行"],"correct_zh":"逆向公交专用道（contraflow bus lane）","explanation_zh":"正确答案：逆向公交专用道（contraflow bus lane）。这是视觉记忆题，别靠语感。把“形状+颜色+线型+灯序”成组背，尤其是红圈、三角警告、黄线、红X和反光道钉。","category":"交通标志/标线/信号","risk":"数字/单位记忆；视觉识别；生词/术语","vocab":"contraflow=逆向车流；give way=让行"},{"id":145,"file":"Screenshot 2026-08-14 at 23.13.50.png","question_en":"What should you do if your vehicle catches fire while you're driving through a tunnel?","options_en":["Leave it where it is, with the engine running","Pull up, then walk to an emergency telephone","Park it away from the carriageway","Drive it out of the tunnel if it's safe to do so"],"correct":"D","question_zh":"车辆在隧道内起火时应该怎么做？","options_zh":["原地停车但让发动机继续运转","靠边停车后步行去紧急电话","把车停到车行道外","如果安全，尽量把车开出隧道"],"correct_zh":"如果安全，尽量把车开出隧道","explanation_zh":"正确答案：如果安全，尽量把车开出隧道。应急题先保人身安全：远离高速车流、不要冒险自行处理；急救题按最基本原则做，不要擅自移动伤员或做破坏性处理。","category":"应急处置/急救","risk":"生词/术语；安全原则/风险判断","vocab":"carriageway=车行道/主车道；pull up=靠边停车；emerge=从支路驶出"},{"id":146,"file":"Screenshot 2026-08-14 at 23.13.53.png","question_en":"What's the nearest you may park to a junction?","options_en":["10 metres (32 feet)","12 metres (39 feet)","15 metres (49 feet)","20 metres (66 feet)"],"correct":"A","question_zh":"停车时距离路口最近至少应留多远？","options_zh":["10米（32英尺）","12米（39英尺）","15米（49英尺）","20米（66英尺）"],"correct_zh":"10米（32英尺）","explanation_zh":"正确答案：10米（32英尺）。距离路口最近应留 10 m（32 ft）。","category":"英国法规/证件/行政","risk":"中国驾驶习惯迁移风险；数字/单位记忆；英国特有规则","vocab":""},{"id":147,"file":"Screenshot 2026-08-14 at 23.13.54.png","question_en":"You've stopped at a railway level crossing. What should you do if the red lights continue to flash after a train has gone by?","options_en":["Phone the signal operator","Alert drivers behind you","Wait","Proceed with caution"],"correct":"C","question_zh":"在铁路平交道口停车等待，一列火车通过后红灯仍继续闪烁，应该怎么做？","options_zh":["给信号员打电话","提醒后车司机","继续等待","谨慎通过"],"correct_zh":"继续等待","explanation_zh":"正确答案：继续等待。恶劣天气题通常更保守：减速、增大距离、正确用灯。灯光题重点区分近光/远光/雾灯/停车灯，以及何时会晃到别人。","category":"天气/灯光/能见度","risk":"生词/术语","vocab":"level crossing=铁路平交道口"},{"id":148,"file":"Screenshot 2026-08-14 at 23.13.56.png","question_en":"You're driving in a slow-moving queue of traffic. What should you do just before changing lane?","options_en":["Sound the horn and flash your lights","Look for motorcyclists filtering through the traffic","Give a 'slowing down' arm signal","Change down to first gear"],"correct":"B","question_zh":"在缓慢移动的车流中，变道前最后应该特别检查什么？","options_zh":["鸣笛并闪灯","查看是否有摩托车在车流间穿行（filtering）","做减速手势","降到一挡"],"correct_zh":"查看是否有摩托车在车流间穿行（filtering）","explanation_zh":"正确答案：查看是否有摩托车在车流间穿行（filtering）。考试会默认行人、骑行者、摩托车、老人和动物可能突然改变路线。正确倾向通常是减速、留空间、不要催促。","category":"弱势道路使用者/风险感知","risk":"中国驾驶习惯迁移风险；视觉识别；生词/术语；安全原则/风险判断","vocab":"filtering=摩托车在车流间穿行；mot=车辆年检（MOT）"},{"id":149,"file":"Screenshot 2026-08-14 at 23.13.58.png","question_en":"What safety device must be fitted to a trailer braking system?","options_en":["Stabiliser","Jockey wheel","Corner steadies","Breakaway cable"],"correct":"D","question_zh":"带制动系统的拖车必须安装哪种安全装置？","options_zh":["稳定器（stabiliser）","支撑轮（jockey wheel）","角支腿（corner steadies）","脱离保护钢索（breakaway cable）"],"correct_zh":"脱离保护钢索（breakaway cable）","explanation_zh":"正确答案：脱离保护钢索（breakaway cable）。带制动拖车要有 breakaway cable，拖车脱离时触发制动。","category":"拖车/牵引规则","risk":"生词/术语；英国特有规则","vocab":"stabiliser=拖车稳定器；jockey wheel=拖车支撑轮；breakaway cable=脱离保护钢索"},{"id":150,"file":"Screenshot 2026-08-14 at 23.13.59.png","question_en":"Who has priority when traffic lights are out of order?","options_en":["Traffic going straight on","Traffic turning right","Nobody","Traffic turning left"],"correct":"C","question_zh":"交通信号灯故障时，谁有优先权？","options_zh":["直行车辆","右转车辆","谁都没有当然优先权","左转车辆"],"correct_zh":"谁都没有当然优先权","explanation_zh":"正确答案：谁都没有当然优先权。交通灯失效时，没有哪一方向自动有优先权。","category":"交通标志/标线/信号","risk":"中国驾驶习惯迁移风险；视觉识别","vocab":""},{"id":151,"file":"Screenshot 2026-08-14 at 23.14.01.png","question_en":"You're travelling behind a moped. What should you do if you want to turn left a short distance ahead?","options_en":["Overtake the moped before the junction","Pull alongside the moped and stay level until just before the junction","Sound your horn as a warning and pull in front of the moped","Stay behind until the moped has passed the junction"],"correct":"D","question_zh":"跟在轻便摩托车（moped）后面，前方不远处要左转，应该怎么做？","options_zh":["在路口前超越它","与它并排行驶，直到临近路口","鸣笛警告后插到它前面","留在它后方，等它通过路口后再转弯"],"correct_zh":"留在它后方，等它通过路口后再转弯","explanation_zh":"正确答案：留在它后方，等它通过路口后再转弯。考试会默认行人、骑行者、摩托车、老人和动物可能突然改变路线。正确倾向通常是减速、留空间、不要催促。","category":"弱势道路使用者/风险感知","risk":"中国驾驶习惯迁移风险；生词/术语；安全原则/风险判断","vocab":"moped=轻便摩托车"},{"id":152,"file":"Screenshot 2026-08-14 at 23.14.03.png","question_en":"What do the long white lines along the centre of the road mean?","options_en":["Bus lane","Hazard warning","Give way","Lane marking"],"correct":"B","question_zh":"道路中央较长的白色线段表示什么？","options_zh":["公交专用道","危险警告标线","让行","车道分隔线"],"correct_zh":"危险警告标线","explanation_zh":"正确答案：危险警告标线。这是视觉记忆题，别靠语感。把“形状+颜色+线型+灯序”成组背，尤其是红圈、三角警告、黄线、红X和反光道钉。","category":"交通标志/标线/信号","risk":"视觉识别；生词/术语","vocab":"give way=让行"},{"id":153,"file":"Screenshot 2026-08-14 at 23.14.05.png","question_en":"You're at a junction controlled by traffic lights. When should you wait at a green light?","options_en":["When pedestrians are waiting to cross","When your exit from the junction is blocked","When you think the lights may be about to change","When you intend to turn right"],"correct":"B","question_zh":"在交通灯控制的路口，即使是绿灯，什么时候也应该等待？","options_zh":["有行人在等着过街时","你要驶入的出口被堵住时","你觉得灯可能快变了时","准备右转时"],"correct_zh":"你要驶入的出口被堵住时","explanation_zh":"正确答案：你要驶入的出口被堵住时。绿灯不代表一定能进路口；如果出口堵住，就应在停止线前等。","category":"弱势道路使用者/风险感知","risk":"中国驾驶习惯迁移风险；视觉识别；安全原则/风险判断","vocab":""},{"id":154,"file":"Screenshot 2026-08-14 at 23.14.06.png","question_en":"At an incident, someone is suffering from severe burns. How could you help them?","options_en":["Apply lotions to the injury","Burst any blisters","Remove anything sticking to the burns","Douse the burns with clean, cool water"],"correct":"D","question_zh":"事故现场有人严重烧伤，应该怎样帮助？","options_zh":["在伤处涂乳液","戳破水泡","把粘在烧伤处的东西撕下来","用干净的凉水持续冲淋烧伤处"],"correct_zh":"用干净的凉水持续冲淋烧伤处","explanation_zh":"正确答案：用干净的凉水持续冲淋烧伤处。严重烧伤用干净凉水持续冲淋；不要涂东西、挑水泡或撕粘连物。","category":"应急处置/急救","risk":"安全原则/风险判断","vocab":""},{"id":155,"file":"Screenshot 2026-08-14 at 23.14.08.png","question_en":"You stop on the hard shoulder of a motorway and use the emergency telephone. Where's the best place to wait for help to arrive?","options_en":["Next to the phone","Well away from the carriageway","With your vehicle","On the hard shoulder"],"correct":"B","question_zh":"在高速公路硬路肩停车并使用紧急电话后，等待救援的最佳位置在哪里？","options_zh":["紧急电话旁","远离车行道的安全位置","待在车辆旁边","站在硬路肩上"],"correct_zh":"远离车行道的安全位置","explanation_zh":"正确答案：远离车行道的安全位置。高速故障等待救援要远离车行道，尽量站到护栏外等安全位置。","category":"高速公路/车道纪律","risk":"中国驾驶习惯迁移风险；生词/术语","vocab":"carriageway=车行道/主车道；hard shoulder=硬路肩；mot=车辆年检（MOT）；emerge=从支路驶出"},{"id":156,"file":"Screenshot 2026-08-14 at 23.14.10.png","question_en":"You're driving towards this level crossing. What would be the first warning of an approaching train?","options_en":["Both half-barriers down","A steady amber light","One half-barrier down","Twin flashing red lights"],"correct":"B","question_zh":"接近铁路平交道口时，火车即将到来的第一个警告通常是什么？","options_zh":["两边半幅栏杆都放下","常亮黄灯","一侧半幅栏杆放下","两盏红灯交替闪烁"],"correct_zh":"常亮黄灯","explanation_zh":"正确答案：常亮黄灯。平交道口火车接近时，第一步警告是常亮黄灯，然后才是红灯闪烁/栏杆动作。","category":"天气/灯光/能见度","risk":"生词/术语","vocab":"level crossing=铁路平交道口"},{"id":157,"file":"Screenshot 2026-08-14 at 23.14.12.png","question_en":"A single carriageway road has this sign. What's the maximum permitted speed for a car towing a trailer?","options_en":["30 mph","40 mph","50 mph","60 mph"],"correct":"C","question_zh":"单车道双向道路（single carriageway）上，如果适用国家限速，汽车牵引拖车的最高允许速度是多少？","options_zh":["30 mph","40 mph","50 mph","60 mph"],"correct_zh":"50 mph","explanation_zh":"正确答案：50 mph。单车道双向道路上，汽车牵引拖车最高 50 mph。","category":"拖车/牵引规则","risk":"数字/单位记忆；生词/术语；英国特有规则","vocab":"carriageway=车行道/主车道；single carriageway=单车道双向道路；towing=牵引"},{"id":158,"file":"Screenshot 2026-08-14 at 23.14.13.png","question_en":"You've just passed your driving test. What's the maximum authorised mass (MAM) of any trailer that you can tow?","options_en":["6,500 kg","5,500 kg","4,500 kg","3,500 kg"],"correct":"D","question_zh":"刚通过驾驶考试后，可以牵引的任何拖车其最大允许质量（MAM）最高是多少？","options_zh":["6,500 kg","5,500 kg","4,500 kg","3,500 kg"],"correct_zh":"3,500 kg","explanation_zh":"正确答案：3,500 kg。拖挂题不要凭普通小汽车经验猜。把专门限速、最右车道限制、MAM/noseweight 和安全连接装置当成独立知识点背。","category":"拖车/牵引规则","risk":"数字/单位记忆；生词/术语；英国特有规则","vocab":"maximum authorised mass=最大允许质量"},{"id":159,"file":"Screenshot 2026-08-14 at 23.14.15.png","question_en":"You're driving at night. What should you do if you're dazzled by headlights coming towards you?","options_en":["Pull down your sun visor","Slow down or stop","Flash your main-beam headlights","Shade your eyes with your hand"],"correct":"B","question_zh":"夜间驾驶时被对向车辆前灯晃眼，应该怎么做？","options_zh":["放下遮阳板","减速，必要时停车","闪远光灯回应","用手遮住眼睛"],"correct_zh":"减速，必要时停车","explanation_zh":"正确答案：减速，必要时停车。被对向灯光晃眼时减速，必要时停车；不要用远光“回敬”。","category":"天气/灯光/能见度","risk":"中国驾驶习惯迁移风险；生词/术语","vocab":"dazzle=晃眼/眩目"},{"id":160,"file":"Screenshot 2026-08-14 at 23.14.17.png","question_en":"What should you do if your vehicle has a puncture on a motorway?","options_en":["Drive slowly to the next service area to get assistance","Pull up on the hard shoulder or in an emergency area. Change the wheel as quickly as possible","Pull up on the hard shoulder or in an emergency area and call for assistance","Switch on your hazard warning lights. Stop in your lane"],"correct":"C","question_zh":"车辆在高速公路上爆胎时应该怎么做？","options_zh":["慢慢开到下一个服务区再求助","停到硬路肩或紧急停车区并尽快自己换胎","停到硬路肩或紧急停车区并呼叫救援","打开危险警示灯并停在当前车道"],"correct_zh":"停到硬路肩或紧急停车区并呼叫救援","explanation_zh":"正确答案：停到硬路肩或紧急停车区并呼叫救援。高速爆胎优先进入硬路肩/紧急停车区并呼叫救援，不要在主车道停，也不建议冒险现场换胎。","category":"高速公路/车道纪律","risk":"中国驾驶习惯迁移风险；生词/术语","vocab":"hard shoulder=硬路肩；emergency area=紧急停车区；hazard warning lights=危险警示灯；mot=车辆年检（MOT）；pull up=靠边停车"},{"id":161,"file":"Screenshot 2026-08-14 at 23.14.19.png","question_en":"You're travelling along a motorway. Where would you find a crawler or climbing lane? Crawler lane","options_en":["On a steep gradient","Before a service area","Before a junction","Along the hard shoulder"],"correct":"A","question_zh":"高速公路上的爬坡车道（crawler/climbing lane）通常在哪里？","options_zh":["陡坡路段","服务区前","路口前","硬路肩上"],"correct_zh":"陡坡路段","explanation_zh":"正确答案：陡坡路段。英国高速的底层逻辑是“默认靠左，右侧主要用于超车”。红X、硬路肩、紧急停车区和并入高速都有专门规则。","category":"高速公路/车道纪律","risk":"生词/术语","vocab":"hard shoulder=硬路肩；crawler=爬坡慢车道；climbing lane=爬坡车道；mot=车辆年检（MOT）"},{"id":162,"file":"Screenshot 2026-08-14 at 23.14.21.png","question_en":"Why should the junction on the left be kept clear?","options_en":["To allow vehicles to enter and emerge","To allow the bus to reverse","To allow vehicles to make a U-turn","To allow vehicles to park"],"correct":"A","question_zh":"为什么左侧这个路口要保持畅通？","options_zh":["让车辆能够进入和驶出","让公交车倒车","让车辆掉头","让车辆停车"],"correct_zh":"让车辆能够进入和驶出","explanation_zh":"正确答案：让车辆能够进入和驶出。英国路口题非常重视观察、车道位置和让行。不要把中国的“右侧快车道/抢空隙/挥手示意”直觉直接套过来。","category":"路口/环岛/超车","risk":"中国驾驶习惯迁移风险；生词/术语","vocab":"emerge=从支路驶出"},{"id":163,"file":"Screenshot 2026-08-14 at 23.14.23.png","question_en":"You're driving at night with your headlights on main beam. A vehicle is overtaking you. When should you dip your headlights?","options_en":["Some time after the vehicle has passed you","Before the vehicle starts to pass you","Only if the other driver dips their headlights","As soon as the vehicle passes you"],"correct":"D","question_zh":"夜间开远光灯时有车辆正在超越你，什么时候应切换为近光灯？","options_zh":["对方完全超过后再等一会儿","对方开始超车前","只有对方先切近光时","对方一超过你就立即切近光"],"correct_zh":"对方一超过你就立即切近光","explanation_zh":"正确答案：对方一超过你就立即切近光。被别人超车时，车辆一超过你就应把远光切到近光，避免从后方晃到对方。","category":"天气/灯光/能见度","risk":"中国驾驶习惯迁移风险；生词/术语","vocab":"main beam=远光灯"},{"id":164,"file":"Screenshot 2026-08-14 at 23.14.25.png","question_en":"Why should you test your brakes after this hazard? Ford","options_en":["You'll be on a slippery road","Your brakes will be wet","You'll be going down a long hill","You'll have just crossed a long bridge"],"correct":"B","question_zh":"通过这个危险（涉水浅滩/ford）后，为什么要测试刹车？","options_zh":["因为接下来路面会很滑","因为刹车可能被水打湿","因为接下来是长下坡","因为刚通过一座长桥"],"correct_zh":"因为刹车可能被水打湿","explanation_zh":"正确答案：因为刹车可能被水打湿。抓住“控制力”这个核心：ABS要持续有力制动；下坡用低挡+谨慎制动；冰雪高挡低扭矩；离合/空挡滑行会降低控制。","category":"车辆控制/机械常识","risk":"生词/术语","vocab":"ford=涉水浅滩"},{"id":165,"file":"Screenshot 2026-08-14 at 23.14.26.png","question_en":"You're travelling along a motorway. When are you allowed to overtake on the left?","options_en":["When you can see well ahead that the hard shoulder is clear","When the traffic in the right-hand lane is signalling right","When you warn drivers behind by signalling left","When in queues and traffic to your right is moving more slowly than you are"],"correct":"D","question_zh":"在高速公路上，什么时候允许从左侧超过其他车辆？","options_zh":["只要前方看得远且硬路肩畅通","右侧车道车辆打右转向灯时","先打左灯提醒后车时","排队行驶且右侧车流比你更慢时"],"correct_zh":"排队行驶且右侧车流比你更慢时","explanation_zh":"正确答案：排队行驶且右侧车流比你更慢时。高速排队时，如果你所在左侧车道自然比右侧快，可以继续前进；这不等于主动左侧超车。","category":"高速公路/车道纪律","risk":"中国驾驶习惯迁移风险；生词/术语","vocab":"hard shoulder=硬路肩；mot=车辆年检（MOT）"},{"id":166,"file":"Screenshot 2026-08-14 at 23.14.28.png","question_en":"When will you feel the effects of engine braking?","options_en":["When you only use the parking brake","When you're in neutral","When you change to a lower gear","When you change to a higher gear"],"correct":"C","question_zh":"什么时候会明显感觉到发动机制动（engine braking）？","options_zh":["只使用手刹时","挂空挡时","换入更低挡位时","换入更高挡位时"],"correct_zh":"换入更低挡位时","explanation_zh":"正确答案：换入更低挡位时。抓住“控制力”这个核心：ABS要持续有力制动；下坡用低挡+谨慎制动；冰雪高挡低扭矩；离合/空挡滑行会降低控制。","category":"车辆控制/机械常识","risk":"规则理解","vocab":""},{"id":167,"file":"Screenshot 2026-08-14 at 23.14.30.png","question_en":"When would you increase the pressure in your tyres so that it's above the normal value?","options_en":["When the roads are slippery","When the vehicle is fitted with anti-lock brakes","When the tyre tread is worn below 2 mm","When carrying a heavy load"],"correct":"D","question_zh":"什么时候需要把轮胎气压调到高于正常值？","options_zh":["道路湿滑时","车辆装有ABS时","胎纹低于2 mm时","承载较重负荷时"],"correct_zh":"承载较重负荷时","explanation_zh":"正确答案：承载较重负荷时。抓住“控制力”这个核心：ABS要持续有力制动；下坡用低挡+谨慎制动；冰雪高挡低扭矩；离合/空挡滑行会降低控制。","category":"车辆控制/机械常识","risk":"数字/单位记忆","vocab":""},{"id":168,"file":"Screenshot 2026-08-14 at 23.14.31.png","question_en":"You're about to go down a steep hill. What should you do to control the speed of your vehicle?","options_en":["Select a high gear and use the brakes carefully","Select a high gear and use the brakes firmly","Select a low gear and use the brakes carefully","Select a low gear and avoid using the brakes"],"correct":"C","question_zh":"准备下陡坡时，怎样控制车速？","options_zh":["挂高挡并小心使用刹车","挂高挡并用力刹车","挂低挡并谨慎使用刹车","挂低挡并完全不用刹车"],"correct_zh":"挂低挡并谨慎使用刹车","explanation_zh":"正确答案：挂低挡并谨慎使用刹车。长下坡用低挡获得发动机制动，同时谨慎使用脚刹；不要只靠刹车。","category":"车辆控制/机械常识","risk":"规则理解","vocab":""},{"id":169,"file":"Screenshot 2026-08-14 at 23.14.33.png","question_en":"Where will you see these red and white markers?","options_en":["Approaching the end of a motorway","Approaching a concealed level crossing","Approaching a concealed speed limit sign","Approaching the end of a dual carriageway"],"correct":"B","quest
